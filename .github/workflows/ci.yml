name: Verify SkillNet
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      DEEPSEEK_API_KEY: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python verify.py
      - run: node tools/front_check.js
      - run: node tools/check_web.js
      - run: node tools/briefing_check.js
      - run: node tools/showcase_check.js
      - run: node tools/product_check.js
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker build -f deploy/Dockerfile.executor -t skillnet-executor:local .
      - run: python tools/docker_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: docker-isolation-evidence
          path: out/docker-smoke.json
