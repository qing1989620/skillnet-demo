<!DOCTYPE html>
<html lang="zh-CN" data-page="chat">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillNet · 对话工作台</title>
<style>
  /* 视觉语言与 Mission Control 一致：浅色、克制、数据优先，不使用 emoji */
  :root{
    --bg:#fbfaf8; --panel:#fff; --soft:#f4f6f8; --line:#e3e8ee;
    --ink:#22303e; --ink2:#5b6b7c; --ink3:#8a97a4;
    --brand:#1a3a5c; --brand2:#24557a; --ok:#2e7d4f; --warn:#b0781a; --bad:#a8433a;
    --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{display:flex;background:var(--bg);color:var(--ink);
    font:13.5px/1.7 "Microsoft YaHei","PingFang SC",sans-serif}

  /* ---------- 左栏：会话历史 ---------- */
  .side{width:308px;flex:0 0 308px;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column}
  .side-head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  .side-head .brand{font-size:13px;font-weight:700;color:var(--brand);letter-spacing:.5px;
    display:flex;align-items:center;gap:8px}
  .side-head .brand i{width:7px;height:7px;border-radius:50%;background:var(--brand2);display:inline-block}
  .side-head .brand span{margin-left:auto;font-weight:400;font-size:11px;color:var(--ink3)}
  .newbtn{margin-top:12px;width:100%;background:var(--brand);color:#fff;border:0;border-radius:6px;
    padding:10px 0;font-size:13px;cursor:pointer;transition:background .15s}
  .newbtn:hover{background:var(--brand2)}
  .slist{flex:1;overflow-y:auto;padding:8px}
  .sitem{padding:10px 12px;border-radius:6px;cursor:pointer;border:1px solid transparent;
    transition:background .15s,border-color .15s}
  .sitem:hover{background:var(--soft)}
  .sitem.on{background:#f2f7fb;border-color:#c9d8e6}
  .sitem .t{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .sitem .m{font-size:11px;color:var(--ink3);margin-top:3px;display:flex;gap:8px}
  .side-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3);
    line-height:1.7}
  .side-foot a{color:var(--brand2);text-decoration:none}

  /* ---------- 右栏：对话与提问 ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:52px;border-bottom:1px solid var(--line);background:#fff;
    display:flex;align-items:center;gap:14px;padding:0 22px}
  .topbar b{font-size:13.5px;color:var(--brand)}
  .topbar .hint{font-size:11.5px;color:var(--ink3)}
  .topbar .sp{flex:1}
  .topbar a{font-size:12px;color:var(--brand2);text-decoration:none}
  .msgs{flex:1;overflow-y:auto;padding:22px 26px 8px}
  .empty{color:var(--ink3);font-size:12.5px;text-align:center;margin-top:60px;line-height:2}
  .turn{margin-bottom:26px}
  .q{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
  .q .who{flex:0 0 26px;height:26px;border-radius:6px;background:var(--soft);color:var(--brand2);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .q .txt{background:var(--brand);color:#fff;border-radius:8px;padding:10px 14px;
    font-size:13px;max-width:min(760px,86%)}
  .acard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 18px;
    margin-left:36px;font-size:12.5px;color:var(--ink2)}
  .acard.err{border-color:#e3c5c2;background:#faf1f0;color:var(--bad)}
  .phases{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .ph{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3)}
  .ph i{width:8px;height:8px;border-radius:50%;background:#d5dde4;display:inline-block}
  .ph.on{color:var(--brand2)} .ph.on i{background:var(--brand2);animation:sp 1s linear infinite}
  .ph.ok{color:var(--ink)} .ph.ok i{background:var(--ok)}
  .ph.no{color:var(--bad)} .ph.no i{background:var(--bad)}
  @keyframes sp{0%{opacity:.35}50%{opacity:1}100%{opacity:.35}}
  .sub{margin-top:8px;font-size:12px;color:var(--ink3)}
  .toggle{margin-top:10px;font-size:12px;color:var(--brand2);cursor:pointer;user-select:none}
  .detail{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .dtabs{display:flex;gap:14px;font-size:12px;margin-bottom:8px}
  .dtabs span{cursor:pointer;color:var(--ink3);padding-bottom:3px}
  .dtabs span.on{color:var(--brand);border-bottom:2px solid var(--brand2)}
  .dsec{display:none} .dsec.on{display:block}

  /* 步骤卡 / 回复卡 / 总结卡（与首页同一套视觉） */
  .stepcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--ink3);
    border-radius:6px;padding:11px 15px;margin-top:10px;font-size:12.5px}
  .stepcard .sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .stepcard .sh b{color:var(--brand)}
  .stepcard .sh span{font-weight:700;white-space:nowrap}
  .stepcard .body{margin-top:6px;display:grid;gap:3px}
  .stepcard pre{white-space:pre-wrap;font:11px/1.6 var(--mono);background:var(--soft);
    padding:8px 10px;border-radius:4px;margin-top:3px;max-height:220px;overflow:auto}
  .ai-reply{margin-top:16px;background:#fff;border:1px solid #d8e2ea;border-radius:8px;
    padding:18px 22px 16px;box-shadow:0 1px 3px rgba(26,58,92,.05)}
  .ai-reply .rp-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
    color:var(--brand);letter-spacing:.5px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .ai-reply .rp-head i{width:7px;height:7px;border-radius:50%;background:var(--brand2);
    box-shadow:0 0 0 3px rgba(36,85,122,.12)}
  .ai-reply .rp-meta{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11px}
  .ai-reply .rp-body{font-size:13.5px;line-height:1.95;margin-top:12px}
  .ai-reply .rp-body h5{font-size:13px;color:var(--brand2);margin:12px 0 4px}
  .ai-reply .rp-body p{margin:7px 0}
  .ai-reply .rp-body ul,.ai-reply .rp-body ol{margin:7px 0 7px 20px}
  .ai-reply .rp-body code{font:12px/1.6 var(--mono);background:var(--soft);padding:1px 5px;
    border-radius:3px;color:var(--brand2)}
  .ai-reply .rp-body pre{background:#f6f8fa;border:1px solid var(--line);border-radius:5px;
    padding:10px 12px;margin:8px 0;overflow:auto;font:12px/1.65 var(--mono);color:var(--ink2)}
  .ai-reply .rp-body table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}
  .ai-reply .rp-body th{background:var(--soft);color:var(--brand2);text-align:left;
    padding:6px 10px;border-bottom:2px solid var(--line)}
  .ai-reply .rp-body td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .ai-reply .rp-body blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid #c9d8e6;
    background:#f8fafc;color:var(--ink2);border-radius:0 4px 4px 0}
  .task-summary{margin-top:14px;background:#fbfcfd;border:1px solid #dbe4ec;border-left:4px solid var(--ok);
    border-radius:8px;padding:18px 22px 16px}
  .task-summary .ts-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
    color:var(--brand);letter-spacing:.5px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .task-summary .ts-head i{width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 0 3px rgba(46,125,79,.12)}
  .task-summary .ts-role{font-size:12.5px;color:var(--ink2);margin:10px 0 4px}
  .task-summary .ts-steps{display:grid;gap:6px;margin:10px 0 4px}
  .task-summary .ts-step{display:grid;grid-template-columns:66px 1fr;gap:10px;font-size:12.5px}
  .task-summary .ts-step b{color:var(--brand2)}
  .task-summary .ts-metrics{display:flex;gap:22px;flex-wrap:wrap;margin:12px 0 6px;padding:10px 14px;
    background:#fff;border:1px solid var(--line);border-radius:6px}
  .task-summary .ts-metrics div{font-size:12.5px;color:var(--ink2)}
  .task-summary .ts-metrics b{font-family:Bahnschrift,"Segoe UI",sans-serif;font-size:15px;
    color:var(--brand);margin-right:4px}
  .task-summary .ts-sec{font-size:11px;letter-spacing:2px;color:var(--ink3);margin:14px 0 6px}
  .task-summary table{width:100%;border-collapse:collapse;font-size:12px}
  .task-summary th{text-align:left;color:var(--ink3);font-weight:400;padding:4px 8px;
    border-bottom:1px solid var(--line)}
  .task-summary td{padding:4px 8px;border-bottom:1px solid var(--line);color:var(--ink2)}
  .task-summary td.up{color:var(--ok);font-weight:600;font-family:var(--mono)}
  .task-summary .newskill{margin-top:8px;padding:10px 14px;background:#f0f7f2;border:1px solid #cfe6d6;
    border-radius:6px;font-size:12.5px}
  .task-summary code{background:#fff;padding:1px 5px;border-radius:3px;font:11.5px var(--mono);color:var(--brand2)}
  .runsum{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px 14px;
    font-size:12.5px;color:var(--ink2);margin-top:10px}
  .runsum a{color:var(--brand2);text-decoration:none}

  /* ---------- 底部输入 ---------- */
  .composer{border-top:1px solid var(--line);background:#fff;padding:14px 26px 16px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font-size:12px;color:var(--ink2);background:var(--soft);border:1px solid var(--line);
    border-radius:14px;padding:4px 12px;cursor:pointer;transition:background .15s}
  .chip:hover{background:#eef3f8}
  .inputrow{display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:8px;padding:10px 14px;
    font:13.5px/1.6 "Microsoft YaHei",sans-serif;color:var(--ink);outline:none;height:46px;
    min-height:46px;max-height:150px;transition:border-color .15s}
  textarea:focus{border-color:var(--brand2)}
  .send{background:var(--brand2);color:#fff;border:0;border-radius:8px;padding:0 22px;height:46px;
    font-size:13.5px;cursor:pointer;transition:background .15s;white-space:nowrap}
  .send:hover:not(:disabled){background:var(--brand)}
  .send:disabled{background:#a9b8c6;cursor:default}
  .foot{margin-top:8px;font-size:11px;color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap}

  @media(max-width:860px){
    .side{display:none}
    .msgs{padding:16px 14px 8px}
    .composer{padding:12px 14px}
  }
</style>

<body>

<aside class="side">
  <div class="side-head">
    <div class="brand"><i></i>SkillNet 对话工作台<span>会话仅存本机</span></div>
    <button class="newbtn" onclick="newSession()">+ 新建对话</button>
  </div>
  <div class="slist" id="slist"></div>
  <div class="side-foot">
    历史只记录<b>问题</b>；每问之下的「查看执行详情」可展开 Agent 回复与完整流程。<br>
    <a href="/">返回首页</a> · <a href="/graph">技能星图</a> · <a href="/dashboard">完整面板</a> · <a href="/runs">运行记录</a>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <button class="mobile-sessions-btn" id="sessions-toggle" aria-label="打开会话历史" aria-expanded="false">☰</button>
    <b id="sess-title">新对话</b>
    <span class="hint" id="sess-hint">提问后会调用完整 Agent 框架：检索 → 选择 → 编排 → 真实执行 → 验收 → 进化</span>
    <span class="sp"></span>
    <a id="last-run" href="#" target="_blank" style="display:none">运行详情 ↗</a>
    <span id="product-nav" style="display:contents"></span>
  </div>
  <div class="msgs" id="msgs" tabindex="0" role="region" aria-label="对话与执行证据"></div>
  <div class="composer">
    <div class="chips" id="chips"></div>
    <div class="inputrow">
      <textarea id="q" aria-label="研究任务" placeholder="输入问题或任务，Enter 发送 · Shift+Enter 换行。可连续追问，系统会自动带上本对话的上下文"></textarea>
      <button class="send" id="send" onclick="submitQ()">发送</button>
      <button class="btn ghost" id="cancel-active" style="display:none">停止</button>
    </div>
    <div class="foot">
      <span>每次真实调用模型；成本与 Token 实时记账</span>
      <span>追问会自动携带本会话此前问答（最多 3 轮）· Enter 发送，Shift+Enter 换行</span>
    </div>
  </div>
</main>

<script>
const API = "";
const LS_KEY = "skillnet_chat_sessions_v1";
let SESSIONS = [], CUR = null, busy = false, activeRun = null;
document.getElementById("product-nav").innerHTML = UI.productNav("chat");
const PHASES = [["retrieval","检索对比"],["ranking","策略选择"],["orchestration","任务编排"],
                ["plan","研究方案"],["dag","DAG 收束"],["exec","真实执行"],["final","验收与进化"]];
const CHIPS = [
  "解释一下费马大定理",
  "对一批剂量-存活率实验数据做清洗并做剂量-反应分析",
  "分析学生考试成绩，找出薄弱环节并给出复习建议表"
];

/* ---------- 基础工具 ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtMs = ms => ms == null ? "—" : (ms >= 1000 ? (ms/1000).toFixed(1) + "s" : Math.max(0, Math.round(ms)) + "ms");
const fmtTime = ts => { const d = new Date(ts);
  return `${d.getMonth()+1}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
async function jget(url, timeout=10000) {
  const controller = new AbortController(), timer = setTimeout(()=>controller.abort(),timeout);
  try { return await UI.json(url,{signal:controller.signal}); }
  catch (error) { if (error.name === "AbortError") throw new Error("请求超时，请检查连接后重试。"); throw error; }
  finally { clearTimeout(timer); }
}

/* 轻量 Markdown → HTML（先转义再解析标记） */
function mdToHtml(md) {
  const inline = s => s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const src = esc(String(md || "")).replace(/```(\w*)\n?([\s\S]*?)```/g,
    (_m, _l, code) => "\u0000PRE" + btoa(unescape(encodeURIComponent(code))) + "\u0000");
  return src.split(/\n{2,}/).map(b => {
    const t = b.trim(); if (!t) return "";
    const pre = t.match(/^\u0000PRE([A-Za-z0-9+/=]*)\u0000$/);
    if (pre) return `<pre>${decodeURIComponent(escape(atob(pre[1])))}</pre>`;
    if (/^#{1,4}\s/.test(t)) return `<h5>${inline(t.replace(/^#{1,4}\s/, ""))}</h5>`;
    if (t.split("\n").filter(l => l.trim()).length >= 2 &&
        t.split("\n").filter(l => l.trim()).every(l => /^\|.*\|$/.test(l.trim()))) {
      const rows = t.split("\n").filter(l => l.trim())
        .map(l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
      const isSep = r => r.every(c => /^:?-{2,}:?$/.test(c));
      const body = rows.slice(isSep(rows[1] || []) ? 2 : 1);
      return "<table><thead><tr>" + rows[0].map(c => `<th>${inline(c)}</th>`).join("") +
        "</tr></thead><tbody>" + body.map(r => "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table>";
    }
    if (/^>\s?/m.test(t)) return `<blockquote>${inline(t.split("\n").map(l => l.replace(/^>\s?/, "")).join("<br>"))}</blockquote>`;
    if (t.split("\n").every(l => !l.trim() || /^\s*[-*]\s/.test(l)))
      return "<ul>" + t.split("\n").filter(l => l.trim()).map(l => `<li>${inline(l.replace(/^\s*[-*]\s/, ""))}</li>`).join("") + "</ul>";
    if (t.split("\n").every(l => !l.trim() || /^\s*\d+[.、)]\s/.test(l)))
      return "<ol>" + t.split("\n").filter(l => l.trim()).map(l => `<li>${inline(l.replace(/^\s*\d+[.、)]\s/, ""))}</li>`).join("") + "</ol>";
    return `<p>${inline(t).replace(/\n/g, "<br>")}</p>`;
  }).filter(Boolean).join("");
}

/* ---------- 会话存储 ---------- */
function loadSessions(){
  try { SESSIONS = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { SESSIONS = []; }
  if (!Array.isArray(SESSIONS)) SESSIONS = [];
  SESSIONS = SESSIONS.filter(s=>s && typeof s.id === "string" && Array.isArray(s.turns)).slice(0,100).map(s=>({...s,turns:s.turns.filter(t=>t && typeof t.q === "string").slice(-50).map(t=>({...t,_loaded:false,_html:"",body:""}))}));
}
function saveSessions(){ try { localStorage.setItem(LS_KEY, JSON.stringify(SESSIONS.map(s=>({...s,turns:s.turns.map(({body,_loaded,_html,...turn})=>turn)})))); } catch {} }
function cur(){ return SESSIONS.find(s => s.id === CUR) || null; }
function newSession(){
  if (busy) return;
  const s = { id: "s" + Date.now(), title: "", created: Date.now(), turns: [] };
  SESSIONS.unshift(s); CUR = s.id; saveSessions(); renderSidebar(); renderMain();
  document.getElementById("q").focus();
}
function openSession(id){ if (busy) return; CUR = id; renderSidebar(); renderMain(); }

/* ---------- 左栏 ---------- */
function renderSidebar(){
  const host = document.getElementById("slist");
  if (!SESSIONS.length){
    host.innerHTML = '<div style="padding:14px;font-size:12px;color:#8a97a4;line-height:1.9">还没有对话。<br>点上方「新建对话」开始。</div>';
    return;
  }
  host.innerHTML = SESSIONS.map(s => `
    <button class="sitem ${s.id === CUR ? "on" : ""}" type="button" data-session="${esc(s.id)}" aria-pressed="${s.id === CUR}">
      <div class="t">${esc(s.title || "（新对话）")}</div>
      <div class="m"><span>${s.turns.length} 问</span><span>${fmtTime(s.created)}</span></div>
    </button>`).join("");
  host.querySelectorAll("[data-session]").forEach(button=>button.addEventListener("click",()=>{openSession(button.dataset.session);closeSessions();}));
}

/* ---------- 右栏渲染 ---------- */
function renderMain(){
  const s = cur(), host = document.getElementById("msgs");
  document.getElementById("sess-title").textContent = s && s.title ? s.title : "新对话";
  const last = s && s.turns.filter(t => t.run_id).slice(-1)[0];
  const link = document.getElementById("last-run");
  if (last){ link.style.display = ""; link.href = `/run?id=${encodeURIComponent(last.run_id)}`; }
  else link.style.display = "none";
  if (!s || !s.turns.length){
    host.innerHTML = '<div class="empty">从一个问题开始，让能力协作起来。<br>' +
      '执行完成后这里会给出：AI 回复 · 每一步的执行解释 · 本次任务总结（SkillNet 的角色与技能库成长）。<br>' +
      '同一个对话里可以继续追问，系统会自动带上上下文。</div>';
    return;
  }
  host.innerHTML = s.turns.map((t, i) => turnHTML(t, i)).join("");
  s.turns.forEach((t, i) => { if (t.run_id && !t._loaded) hydrateTurn(i, t.run_id); });
  host.scrollTop = host.scrollHeight;
}

function turnHTML(t, i){
  return `<div class="turn" id="turn-${i}">
    <div class="q"><div class="who">你</div><div class="txt">${t.q.length>150?`<details class="question-details"><summary>${esc(t.q.slice(0,96))}…<span>展开完整问题 ▾</span></summary><div>${esc(t.q)}</div></details>`:esc(t.q)}</div></div>
    <div class="acard" id="acard-${i}">${t._html || (t.status === "running" && !t.run_id ? phaseBarHTML(i) : '<span style="color:var(--ink3)">正在读取执行记录…</span>')}</div>
  </div>`;
}

function phaseBarHTML(index){
  return '<div class="phases">' + PHASES.map(([k, label]) =>
    `<span class="ph" id="ph-${k}-${index}"><i></i>${label}<b style="font-weight:400;color:var(--ink3)"></b></span>`).join("") +
    `</div><div class="sub" id="ph-sub-${index}">正在创建研究运行…</div><div class="chat-live" id="chat-live-${index}" aria-label="实时执行证据"></div>`;
}
function setPhase(k, state, ms, i){
  const wrap = document.getElementById(`ph-${k}-${i}`) || document.getElementById(`ph-${k}`);
  const dot = wrap && wrap.querySelector("i"), tp = wrap && wrap.querySelector("b");
  if (!wrap) return;
  wrap.className = "ph " + (state === "run" ? "on" : state === "done" ? "ok" : state === "fail" ? "no" : "");
  if (ms != null && tp) tp.textContent = " " + (ms/1000).toFixed(1) + "s";
}
const setSub = (i, txt) => { const el = document.getElementById(`ph-sub-${i}`) || document.getElementById("ph-sub"); if (el) el.textContent = txt; };

/* 步骤明细（含时间轴条） */
function stepCardHTML(s, fin, i){
  const map = { done:["完成","#2e7d4f"], failed:["失败","#a8433a"], skipped:["已跳过","#8a97a4"],
                running:["执行中","#24557a"], pending:["等待","#8a97a4"] };
  const pair = map[s.status] || [s.status, "#8a97a4"];
  const fixed = s.status === "done" && (s.n_attempts || 1) > 1;
  const L = [];
  L.push(`<div><b>做什么：</b>${esc(s.action || "")}</div>`);
  if (s.skill) L.push(`<div><b>使用技能：</b><code>${esc(s.skill)}</code></div>`);
  L.push(`<div><b>执行过程：</b>共 ${s.n_attempts || 1} 次尝试 · 耗时 ${fmtMs(s.duration_ms)}${fixed ? "（前几次失败，已自动修复）" : ""}</div>`);
  const fails = (s.attempts || []).filter(a => !a.ok);
  if (fails.length) L.push(`<div style="margin-left:14px;color:#8a6d3b">失败详情：${fails.map(a => `第 ${a.n} 次 ${esc(a.error_kind || "错误")}（${esc((a.stderr || "").slice(-120))}）`).join("；")}</div>`);
  if ((s.checks || []).length){
    const ok = s.checks.filter(c => c.passed).length;
    L.push(`<div style="margin-left:14px"><b>程序化验收：</b>${ok}/${s.checks.length} 通过${ok < s.checks.length ? ` — 未通过：${s.checks.filter(c => !c.passed).slice(0,3).map(c => esc(c.name)).join("、")}` : ""}</div>`);
  }
  if ((s.artifacts || []).length) L.push(`<div style="margin-left:14px"><b>产出物：</b>${s.artifacts.map(a => `<a href="${API}/api/runs/${encodeURIComponent(fin.run_id)}/artifacts/${encodeURIComponent(a.name)}" target="_blank" style="color:var(--brand2)">${esc(a.name)}</a>（${(a.bytes/1024).toFixed(1)} KB）`).join("、")}</div>`);
  if ((s.inputs || []).length) L.push(`<div style="margin-left:14px;color:#8a97a4">读取的上游产物：${esc(s.inputs.join("、"))}</div>`);
  if (s.status === "skipped" && s.verify_skip_reason) L.push(`<div style="margin-left:14px;color:#8a97a4">${esc(s.verify_skip_reason)}</div>`);
  if (s.status === "failed" && s.error) L.push(`<div style="margin-left:14px;color:var(--bad)">最终错误：${esc(String(s.error).slice(0,200))}</div>`);
  const okAtt = (s.attempts || []).filter(a => a.ok).slice(-1)[0];
  if (okAtt && (okAtt.stdout || "").trim()) L.push(`<div style="margin-left:14px"><b>输出摘要：</b><pre>${esc(okAtt.stdout.slice(-800))}</pre></div>`);
  // 时间轴条（真实 started_at/ended_at）
  const t0 = fin.started_at_ms || (fin.steps?.[0]?.started_at_ms) || 0;
  const total = Math.max(1, fin.duration_ms || 0);
  if (t0 && s.started_at_ms && s.duration_ms > 0){
    const left = Math.max(0, Math.min(99, (s.started_at_ms - t0) / total * 100));
    const w = Math.max(1, Math.min(100 - left, s.duration_ms / total * 100));
    L.push(`<div style="margin-left:14px"><div style="position:relative;height:6px;background:var(--soft);border-radius:3px;overflow:hidden"><div style="position:absolute;left:${left}%;width:${w}%;height:100%;background:${pair[1]};opacity:.72"></div></div><div style="font-size:10.5px;color:#8a97a4;margin-top:2px">时间轴：第 ${((s.started_at_ms - t0)/1000).toFixed(1)}s 开始（占 ${w.toFixed(0)}%）</div></div>`);
  }
  return `<div class="stepcard" style="border-left-color:${pair[1]}">
    <div class="sh"><b>Step ${s.idx+1} · ${esc(s.skill || "通用")}</b><span style="color:${pair[1]}">${pair[0]}${fixed ? "（修复后成功）" : ""}</span></div>
    <div class="body">${L.join("")}</div></div>`;
}

      <div class="ts-step"><b>② 选择</b><span>LinUCB 按任务条件化排序，最终采用 ${s.used_n || 0} 个技能：${esc((imp.used || []).slice(0,8).join("、") || "通用执行")}</span></div>
      <div class="ts-step"><b>③ 编排</b><span>按技能依赖边生成执行 DAG，${steps.length} 步真实执行（含修复后的 ${nFix} 步）</span></div>

/* 完整结果渲染（实时流结束后 / 历史加载） */
function resultHTML(fin){
  const steps = fin.steps || [];
  const nDone = steps.filter(s => s.status === "done").length;
  const nFix = steps.filter(s => s.status === "done" && (s.n_attempts || 1) > 1).length;
  const nFail = steps.filter(s => s.status === "failed").length;
  const nSkip = steps.filter(s => s.status === "skipped").length;
  const cp = (fin.staged || {}).critical_path;
  const cpTxt = cp ? `关键路径 ${cp.steps.map(i => "Step " + (i+1)).join(" → ")}（${(cp.ms/1000).toFixed(1)}s / 总 ${(fin.duration_ms/1000).toFixed(1)}s）` : "";
  const sum = `<div class="runsum"><b style="color:var(--brand)">Run Summary</b> · ` +
    `${fin.status === "COMPLETED" ? "已完成" : fin.status === "PARTIAL" ? "部分完成" : fin.status} · ` +
    `¥${Number(fin.cost_yuan || 0).toFixed(3)} · ${(fin.duration_ms/1000).toFixed(1)}s<br>` +
    `步骤 ${steps.length}：一次通过 <b style="color:var(--ok)">${nDone - nFix}</b> · 修复后成功 <b style="color:var(--warn)">${nFix}</b> · 失败 <b style="color:var(--bad)">${nFail}</b> · 跳过 <b>${nSkip}</b>` +
    (cpTxt ? `<br><span style="color:#8a97a4">${cpTxt}</span>` : "") +
    ` · <a href="/run?id=${encodeURIComponent(fin.run_id)}" target="_blank">运行详情 ↗</a></div>`;
  const reply = (fin.staged || {}).final_reply;
  return sum + Product.evidenceHTML(fin) +
    `<button class="toggle" type="button" aria-expanded="false" onclick="toggleDetail(this)">查看执行详情（${steps.length} 步 · 解释与产物）▾</button>
     <div class="detail" style="display:none">
       <div class="dtabs">
         <button type="button" class="on" onclick="dtab(this,'steps')">每一步执行</button>
         <button type="button" onclick="dtab(this,'raw')">原始事件</button>
       </div>
       <div class="dsec on" data-sec="steps">${steps.map(s => stepCardHTML(s, fin)).join("") || "<div style='color:#8a97a4'>无步骤</div>"}</div>
       <div class="dsec" data-sec="raw"><pre style="max-height:280px;overflow:auto;font:11px/1.6 var(--mono);background:var(--soft);padding:10px;border-radius:4px">${esc(((fin.events || []).map(e => e.type).join(" → ")) || "（无事件记录）")}</pre></div>
     </div>` +
    (reply ? replyCardHTML(reply) : "") +
    `<details class="product-impact"><summary>技能资产变化与完整任务总结</summary>${taskSummaryHTML(fin)}</details>`;
}
function toggleDetail(el){
  const d = el.nextElementSibling;
  const open = d.style.display !== "none";
  d.style.display = open ? "none" : "block";
  el.setAttribute("aria-expanded", String(!open));
  el.textContent = el.textContent.replace(open ? "▾" : "▴", open ? "▴" : "▾");
}
function dtab(el, sec){
  el.parentNode.querySelectorAll("button").forEach(s => s.classList.remove("on"));
  el.classList.add("on");
  const host = el.closest(".detail");
  host.querySelectorAll(".dsec").forEach(s => s.classList.toggle("on", s.dataset.sec === sec));
}

async function hydrateTurn(i, runId){
  const session = cur(), t = session && session.turns[i]; if (!t) return;
  const sessionId = session.id;
  try {
    const fin = await jget(`${API}/api/runs/${encodeURIComponent(runId)}`, 15000);
    t._loaded = true; t.status = fin.status;
    if (CUR !== sessionId || cur()?.turns[i] !== t) return;
    const box = document.getElementById(`acard-${i}`);
    if(!Product.terminal.includes(fin.status)){
      t._html=phaseBarHTML(i);if(box)box.innerHTML=t._html;
      if(!busy){
        busy=true;activeRun=runId;
        document.getElementById('send').disabled=true;document.getElementById('send').textContent='运行中…';document.querySelector('.newbtn').disabled=true;
        document.getElementById('cancel-active').style.display='';document.getElementById('cancel-active').disabled=false;
        try{await stream(i,runId);const final=await jget(`${API}/api/runs/${encodeURIComponent(runId)}`,15000);t.status=final.status;t._html=resultHTML(final);t.reply_digest=(final.staged?.final_reply||'').slice(0,400);if(box?.isConnected)box.innerHTML=t._html;saveSessions();}
        finally{busy=false;activeRun=null;document.getElementById('send').disabled=false;document.getElementById('send').textContent='发送';document.querySelector('.newbtn').disabled=false;document.getElementById('cancel-active').style.display='none';}
      }else if(box)box.innerHTML=`<a href="/run?id=${encodeURIComponent(runId)}">此任务仍在执行，打开实时运行详情 ↗</a>`;
    }else{
      t._html=resultHTML(fin);if(box)box.innerHTML=t._html;
    }
  } catch (e) {
    if (CUR !== sessionId || cur()?.turns[i] !== t) return;
    const box = document.getElementById(`acard-${i}`);
    if (box) box.innerHTML = `<span style="color:var(--ink3)">无法加载该次运行的详情（${esc(e.message || e)}）</span>`;
  }
}

/* ---------- 提问（含追问上下文） ---------- */
async function submitQ(){
  if (busy) return;
  const ta = document.getElementById("q");
  const q = ta.value.trim(); if (!q) return;
  if (!cur()) newSession();
  const s = cur();
  busy = true;
  document.getElementById("send").disabled = true;
  document.getElementById("send").textContent = "运行中…";
  document.querySelector(".newbtn").disabled = true;
  document.getElementById("cancel-active").style.display = "";
  document.getElementById("cancel-active").disabled = true;

  const history = s.turns.map(t => ({ q: t.q, a: t.reply_digest || "", run_id:t.run_id||"" })).slice(-3);
  const turn = { q, run_id: null, ts: Date.now(), status: "running" };
  s.turns.push(turn);
  if (!s.title) s.title = q.slice(0, 34);
  saveSessions(); renderSidebar(); renderMain();
  const idx = s.turns.length - 1;
  ta.value = ""; ta.style.height = "46px";
  document.getElementById("msgs").scrollTop = document.getElementById("msgs").scrollHeight;

  try {
    const r = await fetch(`${API}/api/runs`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task: q, k: 5, max_steps: 3, max_cost_yuan: 1.0,
                             max_seconds: 420, history })
    });
    if (!r.ok){
      const d = await r.json().catch(() => ({}));
      throw new Error(typeof d.detail === "string" ? d.detail : ("HTTP " + r.status));
    }
    const { run_id } = await r.json();
    turn.run_id = run_id; activeRun = run_id; saveSessions();
    try{localStorage.setItem("last_run",run_id);}catch{}
    document.getElementById("cancel-active").disabled = false;
    const link = document.getElementById("last-run");
    link.style.display = ""; link.href = `/run?id=${encodeURIComponent(run_id)}`;
    setSub(idx, "Run 已创建：" + run_id);
    await stream(idx, run_id);
    const fin = await jget(`${API}/api/runs/${encodeURIComponent(run_id)}`, 15000);
    turn.status = fin.status; turn._loaded = true;
    const reply = (fin.staged || {}).final_reply || "";
    turn.reply_digest = reply.replace(/[#*`>\-]/g, "").slice(0, 400);
    const box = document.getElementById(`acard-${idx}`);
    turn._html = resultHTML(fin);
    if (box) box.innerHTML = turn._html;
    saveSessions();
  } catch (e) {
    turn.status = "error";
    const box = document.getElementById(`acard-${idx}`);
    turn._html = UI.errorHTML(e);
    if (box) box.innerHTML = turn._html;
    saveSessions();
  } finally {
    busy = false;
    document.getElementById("send").disabled = false;
    document.getElementById("send").textContent = "发送";
    document.querySelector(".newbtn").disabled = false;
    document.getElementById("cancel-active").style.display = "none";
    activeRun = null;
    document.getElementById(`acard-${idx}`)?.closest(".turn")?.scrollIntoView({block:"start",behavior:"smooth"});
  }
}

async function stream(i, runId){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 480000);
  try {
    await UI.consumeSSE(`${API}/api/runs/${encodeURIComponent(runId)}/stream`, ev=>onEvent(i,ev), ctrl.signal);
  } catch (error) {
    if (error.status === 401 || error.status === 403) throw error;
    setSub(i,"实时连接中断，正在通过运行记录恢复状态…");
  }
  finally { clearTimeout(timer); }
  const deadline = Date.now()+480000;
  while (true) {
    const run = await jget(`${API}/api/runs/${encodeURIComponent(runId)}`,15000);
    if (["COMPLETED","PARTIAL","FAILED","CANCELLED","INTERRUPTED","BUDGET_EXCEEDED"].includes(run.status)) return;
    if (Date.now()>deadline) throw new Error("等待运行超时。任务仍保留在运行中心，可继续查看状态。");
    setSub(i,"任务仍在执行，正在同步运行状态…");
    await new Promise(resolve=>setTimeout(resolve,2000));
  }
}

const LIVE_MODELS={};
function onEvent(i, ev){
  const t = ev.type || "", d = ev.data || ev;
  const live=document.getElementById(`chat-live-${i}`);
  if(live){
    const model=LIVE_MODELS[i]||(LIVE_MODELS[i]={steps:[],log:[]});
    if(t==='dag.ready')model.steps=(d.nodes||[]).map(n=>({...n,status:'pending'}));
    const step=model.steps.find(s=>s.idx===ev.step);
    if(step&&t==='step.started')step.status='running';
    if(step&&t==='step.completed')step.status=d.status||'done';
    const text=t==='retrieval.completed'?`检索候选：${(d.selected||[]).join('、')}`:t==='ranking.completed'?'任务条件化排序已完成':t==='plan.created'?`方案：${d.approach||''}`:t==='step.started'?`步骤 ${ev.step+1} · ${d.action||''}`:t==='step.retry'?`步骤 ${ev.step+1} 自动修复：${d.reason||''}`:t==='artifact.created'?`交付产物：${d.name}`:t==='evolution.proposed'?(d.accepted?'新技能已准入':d.skip_reason||d.feedback?.find(f=>f.skip_reason)?.skip_reason||'本次未准入新技能'):'';
    if(text)model.log.push(text);
    live.innerHTML=Product.dagHTML(model)+`<div class="chat-live-log">${model.log.slice(-4).map(text=>`<p>${esc(text)}</p>`).join('')}</div>`;
  }
  const P = k => document.getElementById(`ph-${k}-${i}`);
  const phase = (key,state,ms)=>setPhase(key,state,ms,i);
  if (t === "retrieval.completed"){ phase("retrieval","done",d.duration_ms); phase("ranking","run");
    setSub(i, `检索完成：三档对照，候选 ${(d.selected || []).length} 个`); }
  else if (t === "ranking.completed"){ phase("ranking","done"); phase("orchestration","run"); }
  else if (t === "orchestration.completed"){ phase("orchestration","done"); phase("dag","run");
    setSub(i, `编排完成：${(d.skills || []).length} 个技能进入执行图`); }
  else if (t === "dag.ready"){ phase("dag","done"); phase("exec","run");
    setSub(i, `执行图就绪：${(d.nodes || []).length} 步（来源 ${d.workflow_source || "—"}）`); }
  else if (t === "plan.created"){ phase("plan","done",d.duration_ms); phase("dag","run");
    setSub(i, `方案生成：${d.steps} 步`); }
  else if (t === "step.started"){ setSub(i, `执行中：Step ${ev.step + 1}`); }
  else if (t === "step.attempt" && d.ok === false){ setSub(i, `Step ${ev.step + 1} 第 ${d.attempt} 次失败，准备修复`); }
  else if (t === "execution.finished"){ phase("exec", d.failed > 0 ? "fail" : "done"); phase("final","run"); }
  else if (t === "evolution.proposed"){ setSub(i, d.accepted ? `技能蒸馏：已准入 ${d.name} · 库规模 ${d.library_size}` : "技能蒸馏：本次未准入"); }
  else if (t === "run.reply"){ phase("final","done"); setSub(i, "Agent 最终回复已生成"); }
  else if (t === "run.failed" || t === "run.budget_exceeded" || t === "run.cancelled"){
    PHASES.forEach(([k]) => { if (P(k) && P(k).className !== "ph ok") phase(k, "fail"); });
    setSub(i, "运行中断：" + String(d.reason || t));
  }
}

  if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); submitQ(); }
});
loadSessions();
if (!SESSIONS.length) newSession(); else { CUR = SESSIONS[0].id; renderSidebar(); renderMain(); }

/* 自检项（仅 selftest 模式读取） */
window.__SELFTEST__ = function(){ return {
  "mdToHtml存在": typeof window.mdToHtml === "function",
  "submitQ存在": typeof window.submitQ === "function",
  "会话列表": !!document.getElementById("slist"),
  "消息区": !!document.getElementById("msgs"),
  "输入框": !!document.getElementById("q")
}; };
</script>

<script>
/* 自检模式（?selftest=1）：收集 JS 运行时错误与关键元素/函数检查，结果写入 #selftest-out 与标题。
   仅用于自动化审计与回归测试（tools/front_audit.py），不影响正常使用路径。 */
(function(){
  if (!location.search.includes("selftest=1")) return;
  var errors = [];
  window.addEventListener("error", function(e){ errors.push("JS错误: " + (e.message || e.type) + " @" + (e.filename||"") + ":" + (e.lineno||0)); });
  window.addEventListener("unhandledrejection", function(e){
    var r = e.reason; errors.push("未处理Promise: " + (r && r.message ? r.message : String(r)).slice(0,200)); });
  var ce = console.error;
  console.error = function(){ try { errors.push("console.error: " + Array.prototype.map.call(arguments, String).join(" ").slice(0,200)); } catch(_){} return ce.apply(console, arguments); };
  setTimeout(function(){
    var checks = { "页面": document.documentElement.dataset.page || location.pathname,
                   "DOM可见内容长度": document.body.innerText.length };
    try { if (typeof window.__SELFTEST__ === "function") Object.assign(checks, window.__SELFTEST__()); }
    catch (e) { errors.push("自检项抛出: " + (e.message || e)); }
    var failed = Object.keys(checks).filter(function(k){ return checks[k] === false; });
    var out = { ok: errors.length === 0 && failed.length === 0, errors: errors, failed: failed, checks: checks };
    var pre = document.createElement("pre"); pre.id = "selftest-out";
    pre.style.cssText = "position:fixed;left:-9999px;top:0";
    pre.textContent = "SELFTEST_JSON=" + JSON.stringify(out);
    document.body.appendChild(pre);
    document.title = "SELFTEST_" + (out.ok ? "PASS" : "FAIL");
  }, 4000);
})();
</script>

</body>
