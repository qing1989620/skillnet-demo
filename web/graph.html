<!DOCTYPE html>
<html lang="zh-CN" data-page="graph">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SkillNet-S1 · 技能星图</title>
<style>
  :root {
    --bg0: #070b12; --bg1: #0d1624; --ink: #e6eef7; --dim: #8a9bb0;
    --line: rgba(140,180,225,.16); --brand: #4a9eff; --evolved: #ff5a4d;
    --panel: rgba(12,20,32,.92);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: radial-gradient(1200px 800px at 50% 42%, var(--bg1) 0%, var(--bg0) 70%);
         color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  canvas { display: block; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  canvas.onnode { cursor: pointer; }

  .hud { position: fixed; pointer-events: none; }
  .tl { top: 20px; left: 24px; }
  .tl h1 { font-size: 16px; font-weight: 700; letter-spacing: .5px; margin-bottom: 4px; }
  .tl .sub { font-size: 12px; color: var(--dim); line-height: 1.7; }
  .tl .sub b { color: var(--ink); font-weight: 600; }
  .legend { top: 20px; right: 24px; text-align: right; font-size: 11.5px; color: var(--dim); }
  .legend .row { margin-bottom: 4px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .legend .ln { display: inline-block; width: 22px; height: 0; border-top: 1.5px solid; margin-right: 6px; vertical-align: 3px; }

  .ctrl { position: fixed; bottom: 22px; left: 24px; display: flex; gap: 8px; pointer-events: auto; }
  .btn { background: rgba(20,32,48,.9); border: 1px solid var(--line); color: var(--ink);
         font-size: 12px; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .btn:hover { border-color: var(--brand); color: #cfe6ff; }
  .btn.on { border-color: var(--brand); color: var(--brand); }

  .card { position: fixed; right: 24px; bottom: 22px; width: 360px; max-height: 62vh; overflow: auto;
          background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px 18px; backdrop-filter: blur(10px); display: none; }
  .card.show { display: block; animation: pop .28s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98);} to { opacity:1; transform:none; } }
  .card h3 { font-size: 15px; margin-bottom: 2px; }
  .card .dom { font-size: 11.5px; color: var(--dim); margin-bottom: 10px; }
  .card .kv { font-size: 12px; color: var(--dim); line-height: 1.9; }
  .card .kv b { color: var(--ink); }
  .card .rel { margin-top: 10px; font-size: 11.5px; }
  .card .rel span { display: inline-block; border: 1px solid var(--line); border-radius: 999px;
                    padding: 1px 9px; margin: 2px 4px 2px 0; color: #a9c4dd; }
  .card .close { position: absolute; top: 12px; right: 14px; cursor: pointer; color: var(--dim); font-size: 16px; }
  .card .close:hover { color: var(--ink); }
  .tip { position: fixed; padding: 4px 9px; background: rgba(10,18,30,.95); border: 1px solid var(--line);
         border-radius: 6px; font-size: 11.5px; color: #cfe0f0; pointer-events: none; display: none; white-space: nowrap; }
  .load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          font-size: 13px; color: var(--dim); background: var(--bg0); z-index: 9; }

  /* 深色底：AI 生成的星图星座背景（裁水印 + 压缩），极淡叠在 canvas 之下，
     为深色沉浸页提供纵深，不干扰节点与连线辨识。 */
  body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: url("/static/assets/bg-dark.jpg") center / cover no-repeat fixed;
    opacity: .42; }
  body > * { position: relative; z-index: 1; }

  :root { --bg-img: url("/static/assets/bg-dark.jpg"); --bg-op: .42; }
  /* 移除 graph 页原有的局部背景定义（改由共享层统一控制） */
</style>
<link rel="stylesheet" href="/static/assets/ui.css?v=0.8.1-restored2">
<script src="/static/assets/ui.js?v=0.8.1-restored2"></script>
</head>
<body>
<div class="load" id="load">正在加载技能图谱…</div>
<canvas id="cv" role="img" aria-label="技能关系图谱。可通过搜索选择技能，并在详情卡片中阅读关联关系。"></canvas>
<header class="graph-nav" id="graph-nav"></header>
<div class="graph-search"><label class="ui-sr-only" for="graph-q">搜索并选择技能</label><input id="graph-q" type="search" placeholder="搜索技能或领域…" autocomplete="off"><div class="graph-search-results" id="graph-results"></div></div>

<div class="hud tl">
  <h1>技能星图 · Skill Relation Graph</h1>
  <div class="sub">
    <b id="nN">—</b> 个技能 · <b id="nE">—</b> 条类型化关系 ·
    <b id="nD">—</b> 个领域　|　节点半径 = 实测平均奖励，朱红 = 演化产生的技能<br>
    拖动节点 / 拖动空白平移 / 滚轮缩放 · 悬停高亮邻域 · 点击查看技能详情
  </div>
</div>

<div class="hud legend">
  <div class="row"><i style="background:#4a9eff"></i>种子技能（按领域着色）</div>
  <div class="row"><i style="background:var(--evolved)"></i>演化技能（使用中长出来的）</div>
  <div class="row"><span class="ln" style="border-color:#5fd0a0;border-top-style:solid"></span>depend_on 依赖</div>
  <div class="row"><span class="ln" style="border-color:#4a9eff;border-top-style:dashed"></span>compose_with 组合</div>
  <div class="row"><span class="ln" style="border-color:rgba(160,180,210,.5);border-top-style:dotted"></span>similar_to 相似</div>
</div>

<div class="ctrl">
  <button class="btn" id="btnZoomOut" aria-label="缩小图谱">−</button>
  <button class="btn" id="btnZoomIn" aria-label="放大图谱">＋</button>
  <button class="btn" id="btnReset">重置视角</button>
  <button class="btn" id="btnPause">暂停布局</button>
  <button class="btn on" id="btnLabel">显示标签</button>
  <button class="btn" id="btnEvolved">只看演化技能</button>
</div>

<div class="card" id="card">
  <button class="close" onclick="closeCard()" type="button" aria-label="关闭技能详情">×</button>
  <h3 id="cName"></h3>
  <div class="dom" id="cDom"></div>
  <div class="kv" id="cKv"></div>
  <div class="rel" id="cRel"></div>
</div>
<div class="tip" id="tip"></div>

<script>
const API = location.origin;
const esc = UI.esc;
document.getElementById("graph-nav").innerHTML = `<a class="ui-wordmark" href="/">${UI.mark}SkillNet <span style="font-weight:400;font-size:12px;letter-spacing:0">/ S1</span></a>${UI.productNav("graph")}`;
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);

/* ---------------- 状态 ---------------- */
const S = {
  nodes: [], edges: [], byId: {},
  view: { x: 0, y: 0, k: 1 }, target: { x: 0, y: 0, k: 1 },
  drag: null, panning: false, hover: null, selected: null,
  paused: reducedMotion, showLabel: true, onlyEvolved: false, t: 0,
};

/* ---------------- 颜色 ---------------- */
const PALETTE = ["#4a9eff","#5fd0a0","#c295f0","#f0b23a","#54c8d8","#e08a5f",
                 "#8ad05f","#d86fa8","#6f8cf0","#5fd6c0","#c0a24a","#9aa8d8",
                 "#e0a0a0","#7fc0e8","#b0c46a","#d08ad0","#7ad0a8","#a8b0e0",
                 "#e8c07a","#90d0e0","#c8a0e0","#a0c8d0"];
let domainColor = {};
document.getElementById("btnPause").textContent = S.paused ? "继续布局" : "暂停布局";

/* ---------------- 物理 ---------------- */
const LINK_LEN = { depend_on: 62, compose_with: 92, similar_to: 130 };
function initPhysics() {
  const cx = 0, cy = 0;
  // 初始布点：按领域分簇，避免全挤在中心
  const domains = [...new Set(S.nodes.map(node=>node.domain))];
  const domIdx = Object.fromEntries(domains.map((domain,index)=>[domain,index]));
  S.nodes.forEach((n, i) => {
    const di = domIdx[n.domain];
    const ang = (di / Math.max(1, Object.keys(domIdx).length)) * Math.PI * 2;
    const R = 175 + (i % 7) * 20;
    n.x = cx + Math.cos(ang) * R + Math.sin(i*17.73) * 32;
    n.y = cy + Math.sin(ang) * R + Math.cos(i*21.34) * 32;
    n.vx = 0; n.vy = 0;
    n.r = 3.4 + Math.min(9, (n.mean_reward || 0) * 11);
    n.fixed = false;
  });
}

function step() {
  const N = S.nodes, E = S.edges;
  const REP = 1500, DAMP = 0.86, CENTER = 0.006;
  // 斥力（O(n²)，90 节点无压力）
  for (let i = 0; i < N.length; i++) {
    const a = N[i];
    for (let j = i + 1; j < N.length; j++) {
      const b = N[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1e-4) { dx = (Math.random() - .5); dy = (Math.random() - .5); d2 = 1; }
      if (d2 > 90000) continue;                       // 远处不算，省算力
      const d = Math.sqrt(d2), f = REP / d2;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
  }
  // 弹簧
  const src = S.byId;
  for (const e of E) {
    const a = src[e.source], b = src[e.target];
    if (!a || !b) continue;
    const L = LINK_LEN[e.type] || 100;
    let dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.max(1, Math.hypot(dx, dy));
    const f = (d - L) * 0.012;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  }
  // 中心引力 + 积分
  for (const n of N) {
    if (n === S.drag) continue;
    if (n.fixed) { n.vx = n.vy = 0; continue; }
    n.vx -= n.x * CENTER; n.vy -= n.y * CENTER;
    n.vx *= DAMP; n.vy *= DAMP;
    const lim = 8;
    n.x += Math.max(-lim, Math.min(lim, n.vx));
    n.y += Math.max(-lim, Math.min(lim, n.vy));
  }
}

/* ---------------- 坐标 ---------------- */
function toScreen(x, y) {
  const v = S.view;
  return [ (x + v.x) * v.k + W / 2, (y + v.y) * v.k + H / 2 ];
}
function toWorld(sx, sy) {
  const v = S.view;
  return [ (sx - W / 2) / v.k - v.x, (sy - H / 2) / v.k - v.y ];
}

/* ---------------- 绘制 ---------------- */
function draw() {
  S.t += 0.016;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // 视角平滑（缩放惯性）
  const v = S.view, tg = S.target;
  v.k += (tg.k - v.k) * 0.18;
  v.x += (tg.x - v.x) * 0.18;
  v.y += (tg.y - v.y) * 0.18;

  const hov = S.hover, sel = S.selected;
  const focus = sel || hov;
  const neigh = new Set();
  if (focus) {
    neigh.add(focus.id);
    for (const e of S.edges) {
      if (e.source === focus.id) neigh.add(e.target);
      if (e.target === focus.id) neigh.add(e.source);
    }
  }

  // 边
  ctx.lineCap = "round";
  for (const e of S.edges) {
    const a = S.byId[e.source], b = S.byId[e.target];
    if (!a || !b) continue;
    if (S.onlyEvolved && !(a.source !== "seed" && b.source !== "seed")) continue;
    const [x1, y1] = toScreen(a.x, a.y), [x2, y2] = toScreen(b.x, b.y);
    const hot = focus && (e.source === focus.id || e.target === focus.id);
    let color, w;
    if (e.type === "depend_on") { color = hot ? "#7dffc0" : "rgba(95,208,160,.42)"; w = hot ? 2.0 : 1.1; }
    else if (e.type === "compose_with") { color = hot ? "#8ccbff" : "rgba(74,158,255,.34)"; w = hot ? 1.8 : 0.9; }
    else { color = hot ? "#d6e2f0" : "rgba(160,180,210,.22)"; w = hot ? 1.4 : 0.7; }
    if (focus && !hot) { ctx.globalAlpha = 0.12; } else { ctx.globalAlpha = 1; }
    ctx.strokeStyle = color; ctx.lineWidth = w;
    if (e.type === "compose_with") ctx.setLineDash([5, 5]);
    else if (e.type === "similar_to") ctx.setLineDash([2, 5]);
    else ctx.setLineDash([]);
    // 高亮时连线流动
    if (hot) { ctx.lineDashOffset = -S.t * 26; }
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
  }
  ctx.globalAlpha = 1;

  // 节点
  for (const n of S.nodes) {
    if (S.onlyEvolved && n.source === "seed") continue;
    const [x, y] = toScreen(n.x, n.y);
    if (x < -60 || y < -60 || x > W + 60 || y > H + 60) continue;
    const evolved = n.source !== "seed";
    const base = evolved ? "#ff5a4d" : (domainColor[n.domain] || "#4a9eff");
    const isFocus = focus && n.id === focus.id;
    const inNeigh = !focus || neigh.has(n.id);
    // 呼吸
    const pulse = reducedMotion ? 1 : 1 + Math.sin(S.t * 1.6 + (n.x + n.y) * 0.01) * 0.05;
    const r = n.r * v.k * (isFocus ? 1.5 : pulse);

    ctx.globalAlpha = inNeigh ? 1 : 0.16;
    // 光晕
    const glow = ctx.createRadialGradient(x, y, 0, x, y, r * (isFocus ? 6 : 3.4));
    glow.addColorStop(0, base + (isFocus ? "66" : "3a"));
    glow.addColorStop(1, "transparent");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, r * (isFocus ? 6 : 3.4), 0, 6.2832); ctx.fill();
    // 实心球
    const g2 = ctx.createRadialGradient(x - r * .3, y - r * .3, 0, x, y, r);
    g2.addColorStop(0, "#ffffff"); g2.addColorStop(.35, base); g2.addColorStop(1, base + "cc");
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    // 选中环
    if (isFocus) {
      ctx.strokeStyle = base; ctx.lineWidth = 1.6; ctx.globalAlpha = .9;
      ctx.beginPath(); ctx.arc(x, y, r + 6, 0, 6.2832); ctx.stroke();
    }
    // 标签延后到第二遍统一绘制（做占位防重叠）
    n._lx = x + r + 5; n._ly = y + 3.5; n._r = r; n._focus = isFocus; n._in = inNeigh;
  }
  ctx.globalAlpha = 1;

  // ---- 标签绘制：屏幕分格占位，聚焦/大节点优先，避免堆叠压字 ----
  if (S.showLabel) {
    const font = Math.max(9.5, Math.min(13, 11 * v.k));
    const CELL = 44;
    const occupied = new Set();
    const cand = [];
    for (const n of S.nodes) {
      if (S.onlyEvolved && n.source === "seed") continue;
      if (n._lx == null) continue;
      if (n._lx < -40 || n._ly < -20 || n._lx > W + 40 || n._ly > H + 20) continue;
      const rank = n._focus ? 0 : (n._in ? 1 : 2);
      cand.push({ n, rank });
    }
    cand.sort((a, b) => a.rank - b.rank || b.n._r - a.n._r);
    for (const { n } of cand) {
      const c0 = Math.floor(n._lx / CELL), c1 = Math.floor(n._ly / CELL);
      const k1 = c0 + "," + c1, k2 = (c0 + 1) + "," + c1;
      if (occupied.has(k1) || occupied.has(k2)) continue;
      occupied.add(k1); occupied.add(k2);
      ctx.globalAlpha = n._focus ? 1 : (n._in ? 0.92 : 0.14);
      ctx.font = `${n._focus ? 600 : 400} ${font}px "Microsoft YaHei", sans-serif`;
      ctx.fillStyle = n._focus ? "#ffffff" : "#c3d5e6";
      ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 4;
      ctx.fillText(n.id, n._lx, n._ly);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }
  for (const n of S.nodes) { n._lx = null; }
}

let FRAMES = 0;
const FRAME_CAP = new URLSearchParams(location.search).get("frames");   // 供无头截图用
function loop() {
  if (document.hidden) { requestAnimationFrame(loop); return; }
  if (!S.paused) { step(); if (FRAME_CAP) step(); }   // 截图模式每帧跑两次物理，加快收敛
  draw();
  FRAMES++;
  // 无头浏览器（Edge --screenshot）无法推进带无限 rAF 的虚拟时钟，
  // 因此支持 ?frames=N：跑够 N 帧后停住，便于自动化截图验证。
  if (FRAME_CAP && FRAMES >= +FRAME_CAP) { S.paused = true; return; }
  requestAnimationFrame(loop);
}

/* ---------------- 交互 ---------------- */
function pick(sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  let best = null, bestD = 1e9;
  const R = 18 / S.view.k;
  for (const n of S.nodes) {
    if (S.onlyEvolved && n.source === "seed") continue;
    const d = Math.hypot(n.x - wx, n.y - wy);
    const hit = Math.max(R, n.r + 6 / S.view.k);
    if (d < hit && d < bestD) { best = n; bestD = d; }
  }
  return best;
}

cv.addEventListener("pointermove", ev => {
  const sx = ev.clientX, sy = ev.clientY;
  if (S.drag) {
    const [wx, wy] = toWorld(sx, sy);
    S.drag.x = wx; S.drag.y = wy; S.drag.vx = S.drag.vy = 0; S.drag.fixed = true;
    return;
  }
  if (S.panning) {
    S.view.x += (ev.movementX || 0) / S.view.k;
    S.view.y += (ev.movementY || 0) / S.view.k;
    S.target.x = S.view.x; S.target.y = S.view.y;
    return;
  }
  const n = pick(sx, sy);
  S.hover = n;
  cv.className = n ? "onnode" : "";
  const tip = document.getElementById("tip");
  if (n) {
    tip.style.display = "block";
    tip.style.left = (sx + 14) + "px"; tip.style.top = (sy + 14) + "px";
    tip.innerHTML = `<b>${esc(n.id)}</b> · ${esc(n.domain)} · 平均奖励 ${(n.mean_reward || 0).toFixed(3)}`
      + (n.source !== "seed" ? " · 演化技能" : "");
  } else tip.style.display = "none";
});

cv.addEventListener("pointerdown", ev => {
  cv.setPointerCapture(ev.pointerId);
  const n = pick(ev.clientX, ev.clientY);
  if (n) { S.drag = n; cv.classList.add("dragging"); }
  else { S.panning = true; cv.classList.add("dragging"); }
});
window.addEventListener("pointerup", () => {
  if (S.drag) { S.drag.fixed = false; S.drag = null; }
  S.panning = false; cv.classList.remove("dragging");
});
cv.addEventListener("click", ev => {
  const n = pick(ev.clientX, ev.clientY);
  if (n) { selectNode(n); } else { closeCard(); }
});
cv.addEventListener("wheel", ev => {
  ev.preventDefault();
  const factor = Math.exp(-ev.deltaY * 0.0012);
  const k0 = S.target.k;
  const k1 = Math.max(0.22, Math.min(3.2, k0 * factor));
  // 以鼠标为中心缩放
  const [wx, wy] = toWorld(ev.clientX, ev.clientY);
  S.target.k = k1;
  S.target.x = (ev.clientX - W / 2) / k1 - wx;
  S.target.y = (ev.clientY - H / 2) / k1 - wy;
}, { passive: false });

function selectNode(n) {
  S.selected = n;
  const card = document.getElementById("card");
  document.getElementById("cName").textContent = n.id;
  document.getElementById("cDom").textContent =
    `${n.domain}　|　${n.source === "seed" ? "种子技能" : "演化技能（G" + (n.generation || 0) + "）"}`;
  const q = n.quality || {};
  const st = n.stats || {};
  const tot = st.exec_total || 0;
  const execLine = tot
    ? `沙箱执行 <b>${tot}</b> 次 · 成功 <b style="color:${(st.exec_ok || 0) / tot >= .7 ? "#5fd0a0" : "#f0b23a"}">${st.exec_ok || 0}</b>`
      + (st.exec_fix ? ` · 修复后成功 <b>${st.exec_fix}</b>` : "")
      + (st.exec_fail ? ` · 失败 <b style="color:#ff5a4d">${st.exec_fail}</b>` : "")
      + "<br>"
    : "";
  document.getElementById("cKv").innerHTML =
    `平均奖励 <b>${(n.mean_reward || 0).toFixed(3)}</b>　·　被调用 <b>${n.pulls || 0}</b> 次<br>`
    + execLine
    + `质量：安全性 <b>${esc(UI.qualityLabel(q.safety))}</b> · 完整性 <b>${esc(UI.qualityLabel(q.completeness))}</b> · 可执行性 <b>${esc(UI.qualityLabel(q.executability))}</b>`;
  const rels = n.relations || [];
  document.getElementById("cRel").innerHTML = rels.length
    ? "关联技能：" + rels.map(r => `<span>${esc(r[0])} → ${esc(r[1])}</span>`).join("")
    : "";
  card.classList.add("show");
}
function closeCard() {
  S.selected = null;
  document.getElementById("card").classList.remove("show");
}
document.addEventListener("keydown",event=>{if(event.key === "Escape"){closeCard();document.getElementById("graph-results").innerHTML="";}});
document.getElementById("graph-q").addEventListener("input",event=>{
  const query=event.target.value.trim().toLowerCase(),host=document.getElementById("graph-results");
  if(!query){host.innerHTML="";return;}
  const nodes=S.nodes.filter(node=>(node.id+" "+node.domain).toLowerCase().includes(query)).slice(0,12);
  host.innerHTML=nodes.map(node=>`<button type="button" data-node="${esc(node.id)}">${esc(node.id)}<span style="display:block;font-size:10px;color:var(--dim);margin-top:3px">${esc(node.domain)}</span></button>`).join("");
  if(!nodes.length)host.innerHTML='<div style="font-size:12px;color:var(--dim);padding:12px">没有匹配技能</div>';
  host.querySelectorAll("[data-node]").forEach(button=>button.addEventListener("click",()=>{
    const node=S.byId[button.dataset.node];if(!node)return;
    if(S.onlyEvolved && node.source === "seed"){S.onlyEvolved=false;document.getElementById("btnEvolved").classList.remove("on");}
    S.target.x=-node.x;S.target.y=-node.y;S.target.k=Math.max(.85,S.target.k);selectNode(node);host.innerHTML="";
  }));
});
document.getElementById("btnZoomIn").onclick=()=>S.target.k=Math.min(3.2,S.target.k*1.2);
document.getElementById("btnZoomOut").onclick=()=>S.target.k=Math.max(.22,S.target.k/1.2);

document.getElementById("btnReset").onclick = () => {
  S.target.x = S.view.x = 0; S.target.y = S.view.y = 0; S.target.k = S.view.k = 1;
  initPhysics(); closeCard();
};
document.getElementById("btnPause").onclick = e => {
  S.paused = !S.paused;
  e.target.textContent = S.paused ? "继续布局" : "暂停布局";
  e.target.classList.toggle("on", S.paused);
};
document.getElementById("btnLabel").onclick = e => {
  S.showLabel = !S.showLabel; e.target.classList.toggle("on", S.showLabel);
};
document.getElementById("btnEvolved").onclick = e => {
  S.onlyEvolved = !S.onlyEvolved; e.target.classList.toggle("on", S.onlyEvolved);
};

/* ---------------- 启动 ---------------- */
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
}
window.addEventListener("resize", resize);

(async function boot() {
  resize();
  let data;
  try {
    data = await UI.json(API + "/api/graph");
  } catch (e) {
    document.getElementById("load").innerHTML = `<div style="text-align:center;padding:24px">${esc(e.message)}<br><a href="/graph" style="display:inline-block;margin-top:16px;color:#a5cfff">重新加载 →</a></div>`;
    return;
  }
  // 技能详情（质量/关系）在 /api/skills 里
  let detail = {};
  try {
    const s = await (await fetch(API + "/api/skills")).json();
    for (const it of (s.items || [])) detail[it.name] = it;
  } catch (e) {}

  for (const n of data.nodes) {
    const d = detail[n.id] || {};
    S.nodes.push({ ...n, quality: d.quality, relations: d.relations, stats: d.stats });
  }
  S.edges = data.edges;
  S.byId = Object.fromEntries(S.nodes.map(n => [n.id, n]));
  window.__GRAPHN__ = S.nodes.length;   // 供自检读取

  const doms = [...new Set(S.nodes.map(n => n.domain))];
  doms.forEach((d, i) => domainColor[d] = PALETTE[i % PALETTE.length]);
  document.getElementById("nN").textContent = S.nodes.length;
  document.getElementById("nE").textContent = S.edges.length;
  document.getElementById("nD").textContent = doms.length;

  initPhysics();
  if(W < 860)S.view.k = S.target.k = .65;
  document.getElementById("load").style.display = "none";
  loop();
})();

/* 自检项（仅 selftest 模式读取） */
window.__SELFTEST__ = function(){ return {
  "canvas存在": !!document.querySelector("canvas"),
  "星图已加载节点": typeof window.__GRAPHN__ === "number" && window.__GRAPHN__ > 0
}; };
</script>

<script>
/* 自检模式（?selftest=1）：收集 JS 运行时错误与关键元素/函数检查，结果写入 #selftest-out 与标题。
   仅用于自动化审计与回归测试（tools/front_audit.py），不影响正常使用路径。 */
(function(){
  if (!location.search.includes("selftest=1")) return;
  var errors = [];
  window.addEventListener("error", function(e){ errors.push("JS错误: " + (e.message || e.type) + " @" + (e.filename||"") + ":" + (e.lineno||0)); });
  window.addEventListener("unhandledrejection", function(e){
    var r = e.reason; errors.push("未处理Promise: " + (r && r.message ? r.message : String(r)).slice(0,200)); });
  var ce = console.error;
  console.error = function(){ try { errors.push("console.error: " + Array.prototype.map.call(arguments, String).join(" ").slice(0,200)); } catch(_){} return ce.apply(console, arguments); };
  setTimeout(function(){
    var checks = { "页面": document.documentElement.dataset.page || location.pathname,
                   "DOM可见内容长度": document.body.innerText.length };
    try { if (typeof window.__SELFTEST__ === "function") Object.assign(checks, window.__SELFTEST__()); }
    catch (e) { errors.push("自检项抛出: " + (e.message || e)); }
    var failed = Object.keys(checks).filter(function(k){ return checks[k] === false; });
    var out = { ok: errors.length === 0 && failed.length === 0, errors: errors, failed: failed, checks: checks };
    var pre = document.createElement("pre"); pre.id = "selftest-out";
    pre.style.cssText = "position:fixed;left:-9999px;top:0";
    pre.textContent = "SELFTEST_JSON=" + JSON.stringify(out);
    document.body.appendChild(pre);
    document.title = "SELFTEST_" + (out.ok ? "PASS" : "FAIL");
  }, 4000);
})();
</script>
