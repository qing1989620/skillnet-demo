<!DOCTYPE html>
<html lang="zh-CN" data-page="dashboard">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillNet · 运行中心</title>
<link rel="stylesheet" href="/static/assets/ui.css?v=0.8.0">
<style>
body{margin:0;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;border-bottom:var(--bd)}
.hb{margin:auto;display:flex;align-items:center}
main{margin:auto}.view{display:none}.view.on{display:block}
.ch{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ch h2{margin:0}.ch .m{color:var(--ink3)}
.card{background:#fff}table{width:100%;border-collapse:collapse;text-align:left}
th,td{border-bottom:var(--bd);vertical-align:middle}tbody tr:last-child td{border-bottom:0}
.badge{display:inline-flex;padding:4px 8px;border:1px solid var(--line);white-space:nowrap;font-size:11px}
.badge[class*="st-"]{color:var(--ink2)}.st-COMPLETED{color:var(--ok)!important}.st-FAILED{color:var(--bad)!important}
.st-PARTIAL,.st-BUDGET_EXCEEDED{color:var(--warn)!important}
.st-RUNNING,.st-EXECUTING,.st-RETRIEVING,.st-ORCHESTRATING,.st-VERIFYING,.st-EVOLVING{color:var(--brand2)!important}
.sys{display:flex;align-items:center;font:12px var(--sans);color:var(--ink2)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--ink3)}.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}.section-label{font-size:14px;font-weight:650;margin:0 0 12px}
.eval-note{background:#f7f9f7;border:var(--bd);border-radius:10px;padding:16px;font-size:13px;color:var(--ink2);line-height:1.8;margin-bottom:24px}
.eval-block+ .eval-block{margin-top:24px}.eval-block h3{font-size:15px;margin:0 0 12px}
.skills-search{width:100%;padding:11px 13px;margin-bottom:18px}
.source-pill{display:inline-flex;padding:2px 7px;border-radius:5px;background:var(--soft);font-size:11px;white-space:nowrap}
.technical-link{font-size:12px;display:block;margin-top:22px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}.workspace-intro .btn{width:auto}.ch .m{max-width:100%}.records-scroll table{min-width:680px}.sys{flex-wrap:wrap}}
</style>
<script src="/static/assets/ui.js?v=0.8.0"></script>
</head>
<body>
<header><div class="hb" id="product-header"></div></header>
<main>
  <div class="workspace-intro">
    <div><div class="ui-kicker">Research operations</div><h1>每一次执行，都有据可查。</h1><p>回看研究任务、检查步骤与产物，追踪技能资产与运行成本。</p></div>
    <a class="btn" href="/chat">创建研究任务 <span aria-hidden="true">↗</span></a>
  </div>
  <div class="run-summary-strip" id="summary" aria-label="最近运行摘要"><div><b>—</b><span>最近运行</span></div><div><b>—</b><span>已完成</span></div><div><b>—</b><span>累计成本 · 元</span></div></div>
  <nav id="nav" class="workspace-tabs" aria-label="运行中心视图"></nav>
  <section class="view" id="v-runs">
    <section class="card"><div class="ch"><h2>运行记录</h2><span class="m" id="runs-meta"></span></div>
      <div class="records-toolbar"><input id="run-q" type="search" placeholder="搜索任务、运行 ID…" aria-label="搜索运行记录"><select id="run-status" aria-label="按状态筛选"><option value="">全部状态</option><option value="COMPLETED">已完成</option><option value="active">运行中</option><option value="PARTIAL">部分完成</option><option value="FAILED">失败</option><option value="INTERRUPTED">已中断</option><option value="CANCELLED">已取消</option><option value="BUDGET_EXCEEDED">超出预算</option></select><button class="btn ghost" id="runs-refresh">刷新记录</button></div>
      <div id="runs-body" class="records-scroll" aria-live="polite"><div class="ui-empty">正在读取运行记录…</div></div>
    </section>
  </section>
  <section class="view" id="v-skills"><section class="card"><div class="ch"><h2>技能资产</h2><span class="m" id="skills-meta"></span></div><input id="q" type="search" class="skills-search" placeholder="搜索技能名、领域或能力…" aria-label="搜索技能"><div id="skills-body" class="records-scroll"><div class="ui-empty">正在读取技能库…</div></div></section></section>
  <section class="view" id="v-eval"><section class="card"><div class="ch"><h2>评估与实验</h2><span class="m">开发集与冻结测试集独立报告</span></div><div id="eval-body"><div class="ui-empty">正在读取实验记录…</div></div></section></section>
  <section class="view" id="v-system"><section class="card"><div class="ch"><h2>服务状态</h2><span class="m" id="sys-meta"></span></div><div id="sys-body"><div class="ui-empty">正在读取服务状态…</div></div></section></section>
  <a href="/dashboard" class="technical-link">打开开发者面板 · 检索对照、研究方案与适配产物 <span aria-hidden="true">↗</span></a>
</main>
<script>
const $ = id => document.getElementById(id), esc = UI.esc;
const VIEWS = ["runs", "skills", "eval", "system"];
const NAMES = {runs:"运行记录",skills:"技能资产",eval:"评估与实验",system:"服务状态"};
const STATUS = {COMPLETED:"已完成",PARTIAL:"部分完成",FAILED:"失败",RUNNING:"运行中",EXECUTING:"执行中",RETRIEVING:"检索中",ORCHESTRATING:"编排中",VERIFYING:"验收中",EVOLVING:"演化中",CANCELLED:"已取消",INTERRUPTED:"已中断",CREATED:"已创建",BUDGET_EXCEEDED:"超出预算"};
const ACTIVE = ["RUNNING","EXECUTING","RETRIEVING","ORCHESTRATING","VERIFYING","EVOLVING","CREATED"];
const fmtMs = ms => ms == null ? "—" : ms >= 1000 ? (ms/1000).toFixed(1)+" 秒" : Math.round(ms)+" 毫秒";
const fmtTime = ms => ms ? new Date(ms).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}) : "—";
const badge = status => `<span class="badge st-${Object.hasOwn(STATUS,status)?status:"CREATED"}">${esc(STATUS[status]||status)}</span>`;
let HEALTH = null, RUNS = [], SKILLS = [], currentView = "runs";
$("product-header").innerHTML = `<a class="ui-wordmark" href="/">${UI.mark}SkillNet<span style="font-weight:400;color:var(--ink3);font-size:12px;letter-spacing:0"> / S1</span></a>${UI.productNav("dashboard")}`;
function route() {
  const requested = location.hash.replace("#/", ""); currentView = VIEWS.includes(requested) ? requested : "runs";
  VIEWS.forEach(view => $("v-"+view).classList.toggle("on",view === currentView));
  $("nav").innerHTML = VIEWS.map(view => `<a href="#/${view}" class="${view === currentView ? "on" : ""}"${view === currentView ? ' aria-current="page"' : ""}>${NAMES[view]}</a>`).join("");
  ({runs:loadRuns,skills:loadSkills,eval:loadEval,system:loadSystem})[currentView]();
}
async function loadHealth() { try { HEALTH = await UI.json("/api/health"); } catch (_) { HEALTH = null; } }
function renderRuns() {
  const query = $("run-q").value.trim().toLowerCase(), status = $("run-status").value;
  const rows = RUNS.filter(run => (!query || (run.task+" "+run.run_id).toLowerCase().includes(query)) && (!status || (status === "active" ? ACTIVE.includes(run.status) : run.status === status)));
  $("runs-meta").textContent = `显示 ${rows.length} / ${RUNS.length} 条 · 最近 60 次运行`;
  $("summary").innerHTML = `<div><b>${RUNS.length}</b><span>最近运行 · 最多 60 条</span></div><div><b>${RUNS.filter(run=>run.status === "COMPLETED").length}</b><span>已完成 · ${RUNS.filter(run=>ACTIVE.includes(run.status)).length} 条运行中</span></div><div><b>¥ ${RUNS.reduce((sum,run)=>sum+Number(run.cost_yuan||0),0).toFixed(3)}</b><span>本列表累计成本 · 元</span></div>`;
  if (!rows.length) { $("runs-body").innerHTML = `<div class="ui-empty">${RUNS.length ? "没有匹配的运行记录。请调整搜索或状态筛选。" : '尚无运行记录。<a href="/chat">创建第一条研究任务 →</a>'}</div>`; return; }
  $("runs-body").innerHTML = `<table><thead><tr><th>研究任务</th><th>状态</th><th>开始时间</th><th>耗时</th><th>步骤 / 产物</th><th>成本</th><th><span class="ui-sr-only">查看运行</span></th></tr></thead><tbody>${rows.map(run => `<tr><td><a class="run-task-link" href="/run?id=${encodeURIComponent(run.run_id)}">${esc(run.task || "未命名任务")}</a><div class="record-id">${esc(run.run_id)}</div></td><td>${badge(run.status)}</td><td>${fmtTime(run.started_at_ms)}</td><td>${fmtMs(run.duration_ms)}</td><td>${Number(run.steps_done||0)} / ${Number(run.steps||0)} 步<br><span style="color:var(--ink3);font-size:12px">${Number(run.artifacts||0)} 个产物</span></td><td>¥ ${Number(run.cost_yuan||0).toFixed(3)}</td><td><a class="run-detail-link" href="/run?id=${encodeURIComponent(run.run_id)}" aria-label="查看 ${esc(run.task || run.run_id)} 的执行记录">查看 <span aria-hidden="true">↗</span></a></td></tr>`).join("")}</tbody></table>`;
}
async function loadRuns() {
  const button = $("runs-refresh"); button.disabled = true;
  try { const data = await UI.json("/api/runs?limit=60"); RUNS = data.runs || []; renderRuns(); }
  catch (error) { $("runs-body").innerHTML = UI.errorHTML(error); }
  finally { button.disabled = false; }
}
async function loadSkills() {
  try {
    if (!SKILLS.length) SKILLS = (await UI.json("/api/skills")).items || [];
    const query = $("q").value.trim().toLowerCase();
    const rows = SKILLS.filter(skill => !query || (skill.name+" "+skill.domain+" "+(skill.capability||"")).toLowerCase().includes(query));
    $("skills-meta").textContent = `${rows.length} / ${SKILLS.length} 个技能 · 统计来自真实执行`;
    $("skills-body").innerHTML = rows.length ? `<table><thead><tr><th>技能</th><th>领域</th><th>来源</th><th>成功 / 执行</th><th>平均奖励</th></tr></thead><tbody>${rows.map(skill=>{const stats = skill.stats||{};return `<tr><td style="color:var(--ink);font-weight:550">${esc(skill.name)}</td><td>${esc(skill.domain)}</td><td><span class="source-pill">${skill.source === "seed" ? "初始技能" : `演化 · G${Number(skill.generation||1)}`}</span></td><td>${stats.exec_total ? `${Number(stats.exec_ok||0)} / ${Number(stats.exec_total)}` : "尚未执行"}</td><td>${stats.pulls ? Number((stats.reward_sum||0)/stats.pulls).toFixed(3) : "—"}</td></tr>`}).join("")}</tbody></table>` : '<div class="ui-empty">没有匹配的技能。请调整搜索词。</div>';
  } catch (error) { $("skills-body").innerHTML = UI.errorHTML(error); }
}
async function loadEval() {
  try {
    const data = await UI.json("/api/results");
    const block = (label, split) => {
      if (!split) return `<div class="eval-block"><h3>${label}</h3><div class="ui-empty">暂无此测试集的实验记录。</div></div>`;
      const rows = [];
      if (split.exp1) (split.exp1.rows||[]).forEach(row=>rows.push(["检索与编排",row.mode,`召回 ${row.recall}% · 编排 ${row.orchestration}%`]));
      if (split.exp2) (split.exp2.rows||[]).forEach(row=>rows.push(["执行质量",row.arm,`盲评均分 ${row.score}`]));
      if (split.exp3) Object.entries(split.exp3.arms||{}).forEach(([arm,result])=>rows.push(["选择策略",arm,`平均奖励 ${result.mean_reward} ± ${result.std ?? "—"}`]));
      return `<div class="eval-block"><h3>${label}</h3><div class="records-scroll"><table><thead><tr><th>实验</th><th>策略</th><th>结果</th></tr></thead><tbody>${rows.map(row=>`<tr>${row.map(value=>`<td>${esc(value)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${split.exp3?.statistics?.verdict ? `<p style="color:var(--ink2);font-size:13px">统计结论：${esc(split.exp3.statistics.verdict)}</p>` : ""}</div>`;
    };
    $("eval-body").innerHTML = '<div class="eval-note">实验结果保留其原始数据集与运行条件。当前技能库持续变化，历史实验不能直接代表当前性能；冻结测试集用于最终评估，开发集用于策略调试。</div>'+block("冻结测试集 · Held-out",data.splits?.heldout)+block("开发集 · Dev",data.splits?.dev);
  } catch (error) { $("eval-body").innerHTML = UI.errorHTML(error); }
}
async function loadSystem() {
  await loadHealth();
  if (!HEALTH) { $("sys-body").innerHTML = UI.errorHTML("无法连接 SkillNet 服务，请检查服务状态后刷新。"); return; }
  $("sys-meta").innerHTML = `<span class="dot ${HEALTH.ok?"on":"off"}"></span>${HEALTH.ok?"服务在线":"服务异常"}`;
  const row = (key,value) => `<tr><td>${key}</td><td>${value}</td></tr>`;
  $("sys-body").innerHTML = `<div class="grid2"><div><h3 class="section-label">运行环境</h3><table><tbody>${row("模型",esc(HEALTH.model||"—"))}${row("模型服务",HEALTH.api_key_configured ? "已配置" : '<span style="color:var(--warn)">尚未配置</span>')}${row("技能资产",`${Number(HEALTH.skills||0)} 个技能 · ${Number(HEALTH.evolved||0)} 个演化技能`)}${row("访问保护",HEALTH.token_required ? "已启用" : "未启用")}${row("界面版本",esc(HEALTH.ui_version||"—"))}</tbody></table></div><div><h3 class="section-label">接入与运维</h3><div class="eval-note">研究任务以独立运行 ID 留痕。执行回放提供步骤、验收、产物与成本；跨框架适配可在开发者面板导出。</div><button class="btn ghost" data-connection-settings>管理当前标签页的访问令牌</button><p><a href="/dashboard">开发者面板 →</a> · <a href="/docs" target="_blank" rel="noopener">API 文档 ↗</a></p></div></div>`;
}
$("run-q").addEventListener("input",renderRuns); $("run-status").addEventListener("change",renderRuns); $("runs-refresh").addEventListener("click",loadRuns); $("q").addEventListener("input",loadSkills);
window.addEventListener("hashchange",route); window.addEventListener("skillnet:connection-changed",route);
route();
window.__SELFTEST__ = () => ({"主容器存在":!!document.querySelector("main"),"有数据表或卡片":!!document.querySelector("table,.card"),"产品导航可用":!!document.querySelector(".ui-product-nav")});
if (new URLSearchParams(location.search).get("selftest") === "1") {
  const errors = []; window.addEventListener("error",event=>errors.push(event.message)); window.addEventListener("unhandledrejection",event=>errors.push(String(event.reason)));
  setTimeout(()=>{const checks = window.__SELFTEST__(); const failed = Object.keys(checks).filter(key=>checks[key] === false); const pre=document.createElement("pre");pre.id="selftest-out";pre.hidden=true;pre.textContent="SELFTEST_JSON="+JSON.stringify({ok:!errors.length&&!failed.length,errors,failed,checks});document.body.appendChild(pre);},4500);
}
</script>
</body>
</html>
