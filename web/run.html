<!DOCTYPE html>
<html lang="zh-CN" data-page="run">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SkillNet · 运行回放</title>
<style>
  /* 视觉原则：technical / precise / quiet / trustworthy / dense but legible
     —— 不使用霓虹渐变、玻璃拟态、彩色 KPI 卡；状态色有语义。 */
  /* Agent 最终回复：与 Mission Control 一致的收尾卡 */
  .ai-reply{margin:18px 0 4px;background:#fff;border:1px solid #d8e2ea;border-radius:8px;
    padding:18px 22px 16px;box-shadow:0 1px 3px rgba(26,58,92,.05)}
  .ai-reply .rp-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
    color:#1a3a5c;letter-spacing:.5px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .ai-reply .rp-head i{width:7px;height:7px;border-radius:50%;background:#24557a;
    box-shadow:0 0 0 3px rgba(36,85,122,.12)}
  .ai-reply .rp-meta{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11px}
  .ai-reply .rp-body{font-size:13px;line-height:1.9;color:var(--ink);margin-top:10px}
  .ai-reply .rp-body h5{font-size:12.5px;color:#24557a;margin:10px 0 3px}
  .ai-reply .rp-body p{margin:6px 0}
  .ai-reply .rp-body ul,.ai-reply .rp-body ol{margin:6px 0 6px 20px}
  .ai-reply .rp-body li{margin:2px 0}
  .ai-reply .rp-body code{font:12px/1.6 var(--mono);background:var(--panel2);padding:1px 5px;
    border-radius:3px;color:#24557a}
  /* 回复区：三栏下方的独立整宽区块（不进入 grid），高度自适应，超过 40vh 才滚动 */
  #ai-reply-wrap{flex:0 0 auto;max-height:40vh;overflow:auto;background:#fff;
    border-top:1px solid var(--line)}
  #ai-reply-wrap .ai-reply .rp-head{padding:12px 20px 10px}
  #ai-reply-wrap .ai-reply .rp-body{padding:0 20px 16px;max-width:1100px}
  .ai-reply .rp-body pre{background:var(--panel2);border:1px solid var(--line);border-radius:5px;
    padding:10px 12px;margin:7px 0;overflow:auto;font:12px/1.65 var(--mono);color:var(--ink2)}
  .ai-reply .rp-body table{width:100%;border-collapse:collapse;margin:9px 0;font-size:12.5px}
  .ai-reply .rp-body th{background:var(--panel2);color:#24557a;text-align:left;padding:6px 10px;
    border-bottom:2px solid var(--line);font-weight:700}
  .ai-reply .rp-body td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .ai-reply .rp-body blockquote{margin:9px 0;padding:8px 14px;border-left:3px solid #c9d8e6;
    background:#f8fafc;color:var(--ink2);border-radius:0 4px 4px 0}
  :root{
    /* 浅色（与 Mission Control / 既有页面一致的视觉语言） */
    --bg:#fbfaf8; --panel:#ffffff; --panel2:#f4f6f8; --line:#e3e8ee;
    --ink:#22303e; --ink2:#5b6b7c; --ink3:#8a97a4;
    --ok:#2e7d4f; --warn:#b0781a; --bad:#a8433a; --info:#1f5f9e; --run:#b0781a;
    --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:13px/1.6 "Microsoft YaHei","PingFang SC",sans-serif;
       display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ---------- Header ---------- */
  header{flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--panel);padding:10px 16px;box-shadow:0 1px 0 rgba(34,48,62,.03);
         display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
  .h-left{display:flex;align-items:center;gap:12px;min-width:0}
  .badge{font:600 11px/1 var(--mono);letter-spacing:.4px;padding:5px 9px;border-radius:3px;
         border:1px solid currentColor;white-space:nowrap}
  .st-COMPLETED{color:var(--ok)} .st-PARTIAL{color:var(--warn)} .st-FAILED{color:var(--bad)}
  .st-RUNNING,.st-EXECUTING,.st-RETRIEVING,.st-ORCHESTRATING,.st-VERIFYING,.st-EVOLVING{color:var(--info)}
  .st-CANCELLED,.st-INTERRUPTED{color:var(--ink3)}
  .st-BUDGET_EXCEEDED{color:var(--warn)} .st-CREATED{color:var(--ink3)}
  .task{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rid{font:400 11px/1 var(--mono);color:var(--ink3);margin-top:2px}
  .h-right{display:flex;align-items:center;gap:16px;font:12px/1.5 var(--mono);color:var(--ink2)}
  .kv b{color:var(--ink);font-weight:600}
  .bar{width:88px;height:4px;background:#e9eef3;border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle}
  .bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
  .bar.warn i{background:var(--warn)}
  button{font:600 12px/1 inherit;padding:7px 13px;border-radius:3px;cursor:pointer;
         background:#fff;color:var(--ink);border:1px solid var(--line)}
  button:hover{border-color:var(--ink3)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.danger{color:var(--bad);border-color:#e6c9c7}

  /* ---------- 三栏 ---------- */
  main{flex:1 1 auto;display:grid;grid-template-columns:290px 1fr 400px;min-height:0}
  .col{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .col:last-child{border-right:none;border-left:1px solid var(--line)}
  .col-h{flex:0 0 auto;padding:9px 14px;border-bottom:1px solid var(--line);
         font:600 11px/1 var(--mono);letter-spacing:.6px;color:var(--ink2);text-transform:uppercase;
         display:flex;justify-content:space-between;align-items:center}
  .col-b{flex:1 1 auto;overflow:auto;padding:12px 14px}

  /* ---------- Graph ---------- */
  .gnode{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:9px 11px;
         margin-bottom:0;cursor:pointer;transition:border-color .18s,background .18s;position:relative}
  .gnode:hover{border-color:var(--ink3)}
  .gnode.sel{border-color:var(--info);background:var(--panel2)}
  .gnode .grow1{display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:0 0 auto}
  .s-waiting .dot{background:var(--ink3)} .s-running .dot{background:var(--info);animation:pulse 1.1s infinite}
  .s-verifying .dot{background:var(--warn);animation:pulse 1.1s infinite} .s-passed .dot{background:var(--ok)}
  .s-retrying .dot{background:var(--warn)} .s-failed .dot{background:var(--bad)} .s-skipped .dot{background:#3a4351}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,95,158,.32)}55%{box-shadow:0 0 0 6px rgba(31,95,158,0)}}
  .gnode .gname{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gnode .gmeta{font:11px/1.6 var(--mono);color:var(--ink3);margin-top:3px}
  .gnode .gskill{display:inline-block;font:11px/1 var(--mono);color:var(--info);
                 border:1px solid #cfe0ef;background:#f2f7fc;border-radius:3px;padding:2px 6px;margin-top:5px}
  .gretry{color:var(--warn);font:600 11px var(--mono)}
  /* 依赖边：标出真实 artifact */
  .gedge{display:flex;flex-direction:column;align-items:center;padding:3px 0;color:var(--ink3)}
  .gedge .ln{width:1px;height:12px;background:var(--line)}
  .gedge .art{font:10.5px/1.4 var(--mono);color:var(--info);border:1px dashed #b9d2e8;border-radius:3px;
              padding:2px 7px;margin:2px 0;cursor:pointer;background:#f7fafd}
  .gedge .art:hover{border-style:solid}

  /* ---------- Timeline ---------- */
  .tl{font:11.5px/1.7 var(--mono)}
  .ev{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:2px 0;align-items:baseline}
  .ev .ts{color:var(--ink3)}
  .ev .msg{color:var(--ink2);word-break:break-word}
  .ev .msg b{color:var(--ink);font-weight:600}
  .ev.ok .msg{color:#2e7d4f} .ev.bad .msg{color:#a8433a} .ev.warn .msg{color:#8a5a15}
  .ev.mile .msg{color:var(--ink);font-weight:600}
  .ev.new{animation:ins .35s ease}
  @keyframes ins{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

  /* ---------- Inspector ---------- */
  .ins-sec{border-bottom:1px solid var(--line);padding:12px 0}
  .ins-sec:first-child{padding-top:0}
  .ins-k{font:600 10.5px/1 var(--mono);letter-spacing:.6px;color:var(--ink3);text-transform:uppercase;margin-bottom:7px}
  .row{display:flex;justify-content:space-between;gap:12px;font:12px/1.8 var(--mono);color:var(--ink2)}
  .row b{color:var(--ink);font-weight:600}
  pre{background:#f7f9fb;border:1px solid var(--line);border-radius:3px;padding:9px 11px;
      font:11px/1.6 var(--mono);color:#2b3846;overflow:auto;max-height:260px;white-space:pre-wrap;word-break:break-word}
  .chk{display:grid;grid-template-columns:18px 1fr;gap:6px;font:11.5px/1.7 var(--mono);color:var(--ink2)}
  .chk .m{color:var(--ok)} .chk.bad .m{color:var(--bad)}
  .layer{border-left:2px solid var(--line);padding-left:10px;margin:9px 0}
  .layer.l1{border-color:var(--ok)} .layer.l2{border-color:var(--info)} .layer.l3{border-color:var(--warn)}
  .layer .lh{display:flex;justify-content:space-between;font:600 11.5px/1.6 var(--mono);margin-bottom:5px}
  .note{font:11.5px/1.6 var(--mono);color:var(--ink2);background:#f7f9fb;border:1px dashed var(--line);
        border-radius:3px;padding:7px 10px;margin-top:8px}
  a{color:var(--info);text-decoration:none} a:hover{text-decoration:underline}
  .empty{color:var(--ink3);font-size:12px;padding:14px 0}

  /* ---------- Mobile（390 单独设计，不缩小桌面） ---------- */
  @media (max-width:860px){
    /* 移动端：Run summary 在顶，三栏变 tabs（Timeline / Graph / Verify），
       Inspector 作为独立 tab；禁止水平溢出。 */
    html,body{overflow-x:hidden;max-width:100vw}
    body{overflow-y:auto;height:auto}
    header{grid-template-columns:1fr;gap:8px;padding:10px 14px}
    .h-right{flex-wrap:wrap;gap:8px 14px;font-size:11.5px}
    .bar{width:60px}
    .task{white-space:normal;overflow:visible}
    main{display:block;height:auto}
    .col{border-right:none;border-bottom:1px solid var(--line)}
    .col:last-child{border-left:none}
    .col-b{max-height:none;overflow:visible}
    .tabs{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
    .tabs button{flex:1;padding:8px 4px;font-size:11.5px}
    .col[data-tab]{display:none} .col[data-tab].on{display:flex}
    .gnode .gname{white-space:normal}
    pre{max-height:200px}
    .ev{grid-template-columns:70px 1fr;gap:6px}
  }
  .tabs{display:none}
</style>

<body>
<header>
  <div class="h-left">
    <a class="run-home-link" href="/runs" aria-label="返回运行中心">←</a>
    <span class="badge" id="status">LOADING</span>
    <div style="min-width:0">
      <div class="task" id="task">…</div>
      <div class="rid" id="rid"></div>
    </div>
  </div>
  <div class="h-right">
    <span class="kv">耗时 <b id="elapsed">0.0s</b></span>
    <span class="kv">成本 <b id="cost">¥0.000</b> / <span id="budget">¥0.20</span>
      <span class="bar" id="costbar"><i style="width:0%"></i></span></span>
    <span class="kv">步骤 <b id="stepstat">0/0</b></span>
    <span class="stream-state" id="stream-state" role="status">正在读取记录</span>
    <button class="ui-settings-btn" data-connection-settings>连接设置</button>
    <button id="focus-view" type="button" aria-pressed="false">集中查看</button>
    <button id="cancel" class="danger">取消运行</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-t="graph" class="on">流程</button>
  <button data-t="timeline">时间线</button>
  <button data-t="inspect">详情</button>
</nav>

<main>
  <section class="col on" data-tab="graph">
    <div class="col-h"><span>执行流程图</span><span id="gcount"></span></div>
    <div class="col-b" id="graph"><div class="empty">等待方案生成…</div></div>
  </section>

  <section class="col" data-tab="timeline">
    <div class="col-h"><span>实时时间线</span><span id="evcount">0 events</span></div>
    <div class="timeline-tools"><select id="event-filter" aria-label="筛选轨迹事件"><option value="all">全部事件</option><option value="milestone">阶段里程碑</option><option value="execution">执行与修复</option><option value="verification">验收与产物</option></select><label><input type="checkbox" id="event-follow" checked> 跟随实时</label></div><div class="col-b" id="timeline"><div class="empty">连接事件流中…</div></div>
  </section>

  <section class="col" data-tab="inspect">
    <div class="col-h"><span>检查器</span><span id="inswhat">—</span></div>
    <div class="col-b" id="inspector"><div class="empty">点击左侧流程节点、依赖产物或时间线事件，在此查看详情。</div></div>
  </section>
</main>

<script>
/* ============================================================================
   Live Run —— 全部内容由 SSE 真实事件驱动；**无 fake animation、无 staged delay**。
   设计约束（来自 Round 2 指令）：
   - 事件到达即渲染，禁止人为节奏；
   - 术语严格：L1 通过 = VERIFIED（确定性校验）；L2 = ASSERTIONS；L3 = SEMANTIC REVIEW；
     **绝不出现 "RESULT CORRECT"**（无 ground truth 时不允许声称结果正确）；
   - 产物依赖必须可见（点击边看 lineage：SHA256/大小/来源步骤）。
   ============================================================================ */
const API = location.origin;
const QS = new URLSearchParams(location.search);
const RUN_ID = QS.get("id") || localStorage.getItem("last_run") || "";
// 截图/审计模式：不建立 SSE 长连接（否则无头浏览器的虚拟时钟无法结束，
// 与 graph.html 的 ?frames=N 是同一类问题），只回放已落盘事件。
const STATIC_MODE = QS.get("static") === "1";
// 指标测量（真实测量，非估计）：
//   TTFE = 首个运行事件到达（服务端）
//   TTFM = 首个"有意义"事件（候选技能/编排方案，即检索或编排完成）
//   TTFV = UI 首次渲染出有决策价值的信息（本页 = Execution Graph 首次绘制完成）
const PERF = { t0: Date.now(), ttfe: null, ttfm: null, ttfv: null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtMs = ms => ms >= 1000 ? (ms/1000).toFixed(1) + "s" : Math.max(0, Math.round(ms)) + "ms";
const fmtTs = ms => { const d = new Date(ms); return d.toTimeString().slice(0,8) + "." + String(d.getMilliseconds()).padStart(3,"0"); };

let RUN = null;          // 最近一次 /api/runs/{id}
let EVENTS = [];         // 收到的全部事件
let SELECTED = null;     // {kind:"step"|"artifact"|"attempt", idx?, name?}
const T0 = Date.now();
const TERMINAL = ["COMPLETED","FAILED","PARTIAL","CANCELLED","INTERRUPTED","BUDGET_EXCEEDED"];
let streamController = null, refreshPending = null, refreshTimer = null, replyText = "";
const received = new Set();
function acceptEvent(event) {
  const key = event.seq != null ? `seq:${event.seq}` : JSON.stringify(event);
  if(received.has(key))return; received.add(key); EVENTS.push(event); appendEvent(event); reactTo(event);
}

/* ---------- SSE ---------- */
async function subscribe(){
  let retry = 1000;
  while (!STATIC_MODE && RUN && !TERMINAL.includes(RUN.status)) {
    streamController = new AbortController();
    $("stream-state").textContent = "实时连接中";
    try {
      const after = EVENTS.reduce((seq,event)=>Math.max(seq,event.seq||0),0);
      await UI.consumeSSE(`${API}/api/runs/${encodeURIComponent(RUN_ID)}/stream?after=${after}`,ev=>{
        if(!ev.type)return;
        if(PERF.ttfe == null)PERF.ttfe = Date.now()-PERF.t0;
        if(PERF.ttfm == null && ["retrieval.completed","orchestration.completed"].includes(ev.type))PERF.ttfm = Date.now()-PERF.t0;
        acceptEvent(ev); retry = 1000;
      },streamController.signal);
    } catch(error) {
      if(error.name === "AbortError")return;
      $("stream-state").textContent = "连接中断 · 正在恢复";
      if(error.status === 401 || error.status === 403){UI.toast(error.message);return;}
    }
    await refresh();
    if(RUN && TERMINAL.includes(RUN.status))break;
    await new Promise(resolve=>setTimeout(resolve,retry)); retry=Math.min(15000,retry*2);
  }
  $("stream-state").textContent = "已同步完整记录";
}
window.addEventListener("pagehide",()=>streamController?.abort());

/* ---------- Header ---------- */
async function refresh(){
  if(refreshPending)return refreshPending;
  refreshPending = UI.json(`${API}/api/runs/${encodeURIComponent(RUN_ID)}`);
  try { RUN = await refreshPending; }
  catch(error) { $("stream-state").textContent="同步失败";if(!RUN){$("timeline").innerHTML=UI.errorHTML(error);$("task").textContent="无法读取执行记录";$("cancel").disabled=true;}return; }
  finally { refreshPending=null; }
  $("status").textContent = ({"COMPLETED":"已完成","PARTIAL":"部分完成","FAILED":"失败","RUNNING":"运行中",
        "EXECUTING":"执行中","RETRIEVING":"检索中","ORCHESTRATING":"编排中","VERIFYING":"验收中","EVOLVING":"进化中",
        "CANCELLED":"已取消","INTERRUPTED":"已中断","CREATED":"已创建","BUDGET_EXCEEDED":"超出预算"}[RUN.status] || RUN.status);
  $("status").className = "badge st-" + RUN.status;
  $("task").textContent = RUN.task || "";
  $("rid").textContent = RUN.run_id || "";
  $("stepstat").textContent = `${(RUN.step_stats||{}).done||0}/${(RUN.step_stats||{}).total||0}`;
  $("budget").textContent = "¥" + (RUN.budget?.max_cost_yuan ?? 0.2).toFixed(2);
  if(!SELECTED && RUN.steps?.length)SELECTED={kind:"step",idx:RUN.steps[0].idx};
  renderGraph(); renderTimelineMeta();
  const m=Product.metrics(RUN);let proof=document.getElementById("run-proof");if(!proof){proof=document.createElement("div");proof.id="run-proof";proof.className="run-proof";$("task").parentNode.appendChild(proof);}proof.textContent=`程序验收 ${m.passed}/${m.checks} · 语义确认 ${m.confirmed}/${m.semantic} · ${m.gate.eligible===false?"学习未准入："+m.gate.reason:m.gate.eligible===true?"具备学习准入证据":"尚未记录学习结论"}`;
  if (SELECTED) renderInspector();
  const done = TERMINAL.includes(RUN.status);
  $("cancel").disabled = done;
  const final = RUN.staged?.final_reply;
  if(final && final !== replyText){replyText=final;renderReply(final);}
  tickHeader();
}
function tickHeader(){
  if (!RUN) return;
  const ms = TERMINAL.includes(RUN.status) ? (RUN.duration_ms ?? Math.max(0,(RUN.ended_at_ms||RUN.started_at_ms)-(RUN.started_at_ms||0))) : Date.now()-(RUN.started_at_ms||Date.now());
  $("elapsed").textContent = fmtMs(ms);
  if (RUN.cost_yuan != null){
    $("cost").textContent = "¥" + Number(RUN.cost_yuan).toFixed(3);
    const cap = RUN.budget?.max_cost_yuan || 1;
    const pct = Math.min(100, RUN.cost_yuan / cap * 100);
    $("costbar").querySelector("i").style.width = pct + "%";
    $("costbar").className = "bar" + (pct > 75 ? " warn" : "");
  }
}
if (!(new URLSearchParams(location.search).get("static") === "1")) setInterval(()=>{if(!document.hidden && RUN && !TERMINAL.includes(RUN.status))tickHeader();}, 1000);

/* ---------- Graph ---------- */
const STEP_STATE = s => {
  if (s.status === "done") {
    const failedChk = (s.checks_total || 0) > (s.checks_passed || 0) || (s.verification_total || 0) > (s.verification_passed || 0);
    return failedChk ? "verifying" : "passed";
  }
  if (s.status === "failed") return s.n_attempts > 1 ? "failed" : "failed";
  if (s.status === "skipped") return "skipped";
  if (s.status === "running") return s.n_attempts > 1 ? "retrying" : "running";
  return "waiting";
};
function renderGraph(){
  const host = $("graph");
  if (!RUN || !RUN.steps) return;
  if (!RUN.steps.length){ host.innerHTML = '<div class="empty">尚无步骤（等方案生成）</div>'; return; }
  const parts = [];
  RUN.steps.forEach((s, i) => {
    const st = STEP_STATE(s);
    const sel = SELECTED && SELECTED.kind === "step" && SELECTED.idx === s.idx ? " sel" : "";
    parts.push(`<div class="gnode s-${st}${sel}" data-step="${s.idx}">
      <div class="grow1"><span class="dot"></span><span class="gname">S${s.idx+1} ${esc(s.action || "（未命名步骤）").slice(0,42)}</span></div>
      <div class="gmeta">${({passed:"执行与验收完成",verifying:"执行完成 · 存在未确认项",failed:"执行失败",skipped:"跳过",retrying:"修复中",running:"执行中",waiting:"等待"})[st]} · ${fmtMs(s.duration_ms||0)}${s.n_attempts>1?` · <span class="gretry">×${s.n_attempts} 尝试</span>`:""}
        ${s.checks_total?` · 检查 ${s.checks_passed}/${s.checks_total}`:""}
        ${s.verification_total?` · 语义 ${s.verification_passed}/${s.verification_total}`:""}</div>
      ${s.skill?`<span class="gskill">${esc(s.skill)}</span>`:""}
    </div>`);
    const dependencies=s.depends_on||[];
    parts.push(`<div class="gedge"><span>${dependencies.length?'依赖 '+dependencies.map(d=>'S'+(d+1)).join(' / '):'根节点 · 可独立启动'}</span></div>`);
    const inputs=s.input_artifacts||[];
    if(inputs.length)parts.push(`<div class="gedge">${inputs.map(a=>`<span class="art" data-art="${esc(a.name)}" data-from="${a.from_step??''}">${esc(a.logical_name)} ← S${a.from_step==null?'?':a.from_step+1}</span>`).join('')}</div>`);
    else if((s.inputs||[]).length)parts.push(`<div class="gedge"><span>输入：${esc(s.inputs.join('、'))}（旧记录未登记版本）</span></div>`);
  });
  host.innerHTML = Product.dagHTML(RUN)+parts.join("");
  if (!STATIC_MODE && !TERMINAL.includes(RUN.status) && PERF.ttfv == null && RUN.steps.length) {
    PERF.ttfv = Date.now() - PERF.t0;
    // 上报（落盘到 Run，供审计）：一次 per page load
    try {
      const data = Object.fromEntries(Object.entries({ttfe:PERF.ttfe,ttfm:PERF.ttfm,ttfv:PERF.ttfv}).filter(([,value])=>typeof value === "number" && Number.isFinite(value) && value >= 0));
      fetch(`${API}/api/runs/${encodeURIComponent(RUN_ID)}/perf`, {
        method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({data})
      }).catch(()=>{});
    } catch {}
  }
  host.querySelectorAll(".gnode").forEach(el => el.onclick = () => {
    SELECTED = { kind: "step", idx: +el.dataset.step }; renderGraph(); renderInspector();inspectMobile();
  });
  host.querySelectorAll(".art").forEach(el => el.onclick = ev => {
    ev.stopPropagation();
    SELECTED = { kind: "artifact", name: el.dataset.art, from: +el.dataset.from };
    renderGraph(); renderInspector();inspectMobile();
  });
  $("gcount").textContent = `${RUN.steps.length} steps`;
}

/* ---------- Timeline ---------- */
const EV_STYLE = t => t.startsWith("run.completed") || t === "execution.finished" ? "mile"
  : t === "run.finished" ? "mile"
  : t.includes("error") || t.includes("failed") ? "bad"
  : t === "step.retry" ? "warn"
  : t === "artifact.created" || t === "check.result" || t === "step.completed" ? "ok" : "";
const EV_TEXT = (ev) => {
  const d = ev.data || {};
  switch (ev.type) {
    case "run.started": return `任务已创建 · <b>${esc((d.task||"").slice(0,90))}</b>`;
    case "retrieval.completed": return `检索完成 · <b>${(d.selected||[]).length}</b> 个候选 · 分流 <b>${esc(d.decision||"")}</b> · ${fmtMs(d.duration_ms||0)}`;
    case "ranking.completed": return `任务条件化排序 · 首选： <b>${esc(d.top||"—")}</b>`;
    case "orchestration.completed": return `技能编排完成 · <b>${(d.skills||[]).length}</b> 个技能 · ${(d.edges||[]).length} 条依赖 · ${fmtMs(d.duration_ms||0)}`;
    case "plan.created": return `研究方案 — <b>${d.steps}</b> 个步骤 · ${fmtMs(d.duration_ms||0)}`;
    case "run.executing": return `开始执行 <b>${d.steps}</b> 个步骤`;
    case "step.started": return `Step ${ev.step+1} 开始 — ${esc((d.action||"").slice(0,80))}${d.skill?` · <b>${esc(d.skill)}</b>`:""}`;
    case "step.inputs": return `Step ${ev.step+1} 输入 ← <b>${esc((d.files||[]).join(", "))}</b>`;
    case "code.generating": return `Step ${ev.step+1}: 生成代码（第 ${d.attempt} 次尝试）`;
    case "step.attempt": return `Step ${ev.step+1} 尝试 #${d.attempt} <b>${d.ok?"成功":"失败"}</b>${d.error_kind?` · ${esc(d.error_kind)}`:""} · ${fmtMs(d.duration_ms||0)}`;
    case "step.retry": return `Step ${ev.step+1}: 请求修复 — ${esc(d.reason||"")}`;
    case "artifact.created": return `✓ <b>${esc(d.name)}</b> 已创建 (${(d.bytes/1024).toFixed(1)} KB)`;
    case "check.result": return `${d.passed?"✓":"✗"} ${esc(d.name)}${d.passed?"":` — ${esc((d.detail||"").slice(0,70))}`}`;
    case "step.completed": return `Step ${ev.step+1} 完成 — ${d.status} · 产物 ${d.artifacts} · 验收 ${d.checks} · ${fmtMs(d.duration_ms||0)}`;
    case "step.error": return `Step ${ev.step+1} 异常 — ${esc((d.error||"").slice(0,90))}`;
    case "steps.skipped": return `步骤 ${JSON.stringify(d.steps)} 被跳过 — ${esc(d.reason||"")}`;
    case "execution.finished": return `执行结束 — 成功 <b>${d.done}</b> · 失败 <b>${d.failed}</b> · ${fmtMs(d.duration_ms||0)}`;
    case "judge.completed": return `方案盲评 — 加权 <b>${d.weighted}</b>${d.coverage!=null?` · 覆盖 ${d.coverage}`:""}`;
    case "evolution.proposed": return `技能蒸馏 — ${d.accepted?`已准入 <b>${esc(d.name)}</b>`:"未准入"} · 库规模 ${d.library_size}`;
    case "run.reply": renderReply(d.text || ""); return `Agent 最终回复已生成（${(d.text||"").length} 字）`;
    case "run.finished": return `<b>运行结束 ${esc(Product.labels[d.status]||d.status)}</b> · ${fmtMs(d.duration_ms||0)} · ¥${Number(d.cost||0).toFixed(3)}`;
    case 'dag.ready':return `执行图就绪 · ${(d.nodes||[]).length} 个节点 · 依赖来自 ${esc(d.workflow_source||'编排')}`;
    case 'code.generated':return `步骤 ${ev.step+1} 代码已生成 · 点击查看实际代码与输入`;
    case 'step.verifying':return `步骤 ${ev.step+1} 进入验收 · ${esc(d.layer||'程序与语义')}`;
    case 'verification.result':return `步骤 ${ev.step+1} 语义确认 ${d.passed?'通过':'未通过'} · ${esc(d.item||'')}`;
    case 'verification.completed':return `步骤 ${ev.step+1} 验收完成 · ${d.passed??'—'}/${d.total??'—'}`;
    case 'run.cancel_requested':return '已请求停止 · 将在执行检查点退出';
    case 'run.cancelled':return '任务已取消 · 已完成产物与轨迹保留';
    case 'run.failed':return '任务失败 · '+esc(d.reason||d.error||'查看原始事件');
    case 'run.budget_exceeded':return '预算到达上限 · '+esc(d.reason||'执行已停止');
    default: return `<span>${esc(ev.type)}</span> · 点击查看原始事件`;
  }
};
/* 同类 check 结果聚合成一行：避免几十条 "✓ 文件存在" 淹没真正的里程碑事件。

const CHECK_AGGR = new Map();   // stepIdx -> {el, n, ok, bad:[]}
function appendEvent(ev){
  const host = $("timeline");
  const follow=$("event-follow").checked && host.scrollHeight-host.scrollTop-host.clientHeight<100;
  if (host.querySelector(".empty")) host.innerHTML = "";
  if (ev.type === "check.result" && ev.step != null) {
    const key = ev.step;
    let g = CHECK_AGGR.get(key);
    if (!g) {
      const div = document.createElement("div");
      div.className = "ev ok new";div.dataset.category="verification";
      div.innerHTML = `<span class="ts">${fmtTs(ev.ts_ms)}</span><span class="msg"></span>`;
      div.onclick = () => { SELECTED = {kind:"step", idx:key}; renderGraph(); renderInspector();inspectMobile(); };
      host.appendChild(div);
      g = { el: div, n: 0, ok: 0, bad: [] };
      CHECK_AGGR.set(key, g);
    }
    g.n++; if (ev.data && ev.data.passed) g.ok++; else g.bad.push((ev.data||{}).name || "");
    const cls = g.bad.length ? "warn" : "ok";
    g.el.className = "ev " + cls;
    g.el.querySelector(".msg").innerHTML =
      `Step ${key+1}: 确定性检查 <b>${g.ok}/${g.n}</b> 通过`
      + (g.bad.length ? ` — 未过：${esc(g.bad.slice(0,3).join("; "))}` : "")
      + ` <span style="color:var(--ink3)">（点击查看明细）</span>`;
    applyEventFilter();if(follow)host.scrollTop = host.scrollHeight; updateEvCount(); return;
  }
  const div = document.createElement("div");
  div.className = "ev " + EV_STYLE(ev.type) + " new";
  div.dataset.category=ev.type.startsWith("artifact.")||ev.type.startsWith("verification.")?"verification":ev.type.startsWith("step.")||ev.type.startsWith("code.")?"execution":"milestone";
  div.innerHTML = `<span class="ts">${fmtTs(ev.ts_ms)}</span><span class="msg">${EV_TEXT(ev)}</span>`;
  div.onclick = () => { SELECTED = ev.step != null?{kind:"step",idx:ev.step}:{kind:"event",event:ev};renderGraph();renderInspector();inspectMobile(); };
  host.appendChild(div);
  if(follow)host.scrollTop = host.scrollHeight;
  applyEventFilter();updateEvCount();
}

/* ---------- Agent 最终回复（Markdown 轻渲染，先 esc 再处理标记） ---------- */
const mdToHtml = md => {
  const inline = s => s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
                        .replace(/`([^`]+)`/g, "<code>$1</code>");
  const src = (typeof esc === "function" ? esc(String(md || "")) : String(md || ""))
    .replace(/```(\w*)\n?([\s\S]*?)```/g,
      (_m, _l, code) => "\u0000PRE" + btoa(unescape(encodeURIComponent(code))) + "\u0000");
  return src.split(/\n{2,}/).map(b => {
    const x = b.trim(); if (!x) return "";
    const pre = x.match(/^\u0000PRE([A-Za-z0-9+/=]*)\u0000$/);
    if (pre) return "<pre>" + decodeURIComponent(escape(atob(pre[1]))) + "</pre>";
    if (/^#{1,4}\s/.test(x)) return "<h5>" + inline(x.replace(/^#{1,4}\s/, "")) + "</h5>";
    if (x.split("\n").filter(l => l.trim()).length >= 2 &&
        x.split("\n").filter(l => l.trim()).every(l => /^\|.*\|$/.test(l.trim()))) {
      const rows = x.split("\n").filter(l => l.trim())
        .map(l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
      const isSep = r => r.every(c => /^:?-{2,}:?$/.test(c));
      const body = rows.slice(isSep(rows[1] || []) ? 2 : 1);
      return "<table><thead><tr>" + rows[0].map(c => `<th>${inline(c)}</th>`).join("") +
        "</tr></thead><tbody>" + body.map(r => "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table>";
    }
    if (/^>\s?/m.test(x)) {
      const q = x.split("\n").map(l => l.replace(/^>\s?/, "")).join("<br>");
      return `<blockquote>${inline(q)}</blockquote>`;
    }
    if (x.split("\n").every(l => !l.trim() || /^\s*[-*]\s/.test(l)))
      return "<ul>" + x.split("\n").filter(l => l.trim())
        .map(l => "<li>" + inline(l.replace(/^\s*[-*]\s/, "")) + "</li>").join("") + "</ul>";
    if (x.split("\n").every(l => !l.trim() || /^\s*\d+[.、)]\s/.test(l)))
      return "<ol>" + x.split("\n").filter(l => l.trim())
        .map(l => "<li>" + inline(l.replace(/^\s*\d+[.、)]\s/, "")) + "</li>").join("") + "</ol>";
    return "<p>" + inline(x).replace(/\n/g, "<br>") + "</p>";
  }).filter(Boolean).join("");
};
function renderReply(text){
  const old = document.getElementById("ai-reply-wrap"); if (old) old.remove();
  if (!text) return;
  // 注意：main 是三栏 grid（290 / 1fr / 400）。回复若插进 main 会变成第 4 个格子，
  // 被挤到第二行并被 overflow:hidden 压扁（曾出现"只能滑动一小块、字看不全"）。
  // 正确做法：插到 main 之后，作为 body 内独立整宽区块（flex 列最后一个孩子）。
  const main = document.querySelector("main");
  if (!main) return;
  const wrap = document.createElement("div");
  wrap.id = "ai-reply-wrap";
  wrap.innerHTML = '<details><summary>Agent 最终回复 · 展开阅读本次研究结论</summary><div class="ai-reply" style="margin:0;border:0;border-radius:0;box-shadow:none">' +
      '<div class="rp-head"><i></i>Agent 最终回复' +
      '<span class="rp-meta">基于本次真实执行数据生成 · 整宽显示，可滚动查看全文</span></div>' +
      '<div class="rp-body">' + mdToHtml(text) + '</div></div></details>';
  main.parentNode.insertBefore(wrap, main.nextSibling);
}

/* ---------- boot ---------- */
(async function boot(){
  if (!RUN_ID){ $("task").textContent="尚未选择运行记录";$("status").textContent="待选择";$("timeline").innerHTML='<div class="ui-empty">请从运行中心选择一条任务。<a href="/runs">查看运行记录 →</a></div>';$("cancel").disabled=true;return; }
  await refresh();
  if(!RUN)return;
  // 先回放已发生的事件（刷新页面后时间线不空）
  try {
    const evs = (RUN.events || []); EVENTS = []; received.clear();
    CHECK_AGGR.clear(); $("timeline").innerHTML = "";
    evs.forEach(ev=>{const key=ev.seq != null ? `seq:${ev.seq}`:JSON.stringify(ev);received.add(key);EVENTS.push(ev);appendEvent(ev);});
    updateEvCount();
  } catch {}
  if (!STATIC_MODE && !TERMINAL.includes(RUN.status)) subscribe();
  else { $("stream-state").textContent="已同步完整记录";if(STATIC_MODE)$("cancel").disabled=true; }
  tickHeader();
  // 历史 run 复查：回复已落盘则直接渲染
  try { if (RUN.staged && RUN.staged.final_reply) renderReply(RUN.staged.final_reply); } catch {}
})();

/* 自检项（仅 selftest 模式读取） */
window.__SELFTEST__ = function(){
  // 内容被裁剪检测：overflow:hidden 且内容明显溢出的容器 = 用户会"只能看一小块"
  var clipped = [];
  Array.prototype.forEach.call(document.querySelectorAll("main > *, .col, .col-b, #ai-reply-wrap, body > div"), function (el) {
    var cs = getComputedStyle(el);
    if (cs.overflowY !== "hidden") return;
    if (el.scrollHeight > el.clientHeight + 24 && el.clientHeight > 0) clipped.push(el.className || el.id || el.tagName);
  });
  return {
  "无内容被裁剪": clipped.length === 0,
  "被裁剪容器": clipped.join(", ") || "无",
  "回复区宽度": (function(){ var w = document.getElementById("ai-reply-wrap");
      return w ? Math.round(w.getBoundingClientRect().width) + "px / 父=" + w.parentNode.tagName : "未渲染"; })(),
  "时间线容器": !!document.getElementById("timeline"),
  "检查器容器": !!document.getElementById("inspector")
}; };
</script>

<script>
/* 自检模式（?selftest=1）：收集 JS 运行时错误与关键检查，结果写入 #selftest-out 与标题。 */
(function(){
  if (!location.search.includes("selftest=1")) return;
  var errors = [];
  window.addEventListener("error", function(e){ errors.push("JS错误: " + (e.message || e.type) + " @" + (e.filename||"") + ":" + (e.lineno||0)); });
  window.addEventListener("unhandledrejection", function(e){
    var r = e.reason; errors.push("未处理Promise: " + (r && r.message ? r.message : String(r)).slice(0,200)); });
  var ce = console.error;
  console.error = function(){ try { errors.push("console.error: " + Array.prototype.map.call(arguments, String).join(" ").slice(0,200)); } catch(_){} return ce.apply(console, arguments); };
  setTimeout(function(){
    var checks = { "页面": document.documentElement.dataset.page || location.pathname,
                   "DOM可见内容长度": document.body.innerText.length };
    try { if (typeof window.__SELFTEST__ === "function") Object.assign(checks, window.__SELFTEST__()); }
    catch (e) { errors.push("自检项抛出: " + (e.message || e)); }
    var failed = Object.keys(checks).filter(function(k){ return checks[k] === false; });
    var out = { ok: errors.length === 0 && failed.length === 0, errors: errors, failed: failed, checks: checks };
    var pre = document.createElement("pre"); pre.id = "selftest-out";
    pre.style.cssText = "position:fixed;left:-9999px;top:0";
    pre.textContent = "SELFTEST_JSON=" + JSON.stringify(out);
    document.body.appendChild(pre);
    document.title = "SELFTEST_" + (out.ok ? "PASS" : "FAIL");
  }, 4500);
})();
</script>
